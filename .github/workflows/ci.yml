        run: |
          SAN="-fsanitize=address,undefined -fno-omit-frame-pointer -g -O1 -std=gnu++20 -Ipoc/ide"
          c++ $SAN poc/ide/compile/diagnostics_test.cpp poc/ide/compile/diagnostics.cpp -o ide_diag_san
