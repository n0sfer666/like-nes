name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-determinism:
    name: build+determinism (${{ matrix.os }})
    # 60, а не 30: у джоба четыре build-каталога (headless `build`, `build-audio`, `build-ui`,
    # `build-asan` под clang-cl) — каждый со своим configure и своим FetchContent. Самый дорогой
    # из них `build-ui`: только там собираются glfw и шесть TU imgui, и только там сборочный гейт
    # видит вендоренные объекты MSVC.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # NOTE: третьи-партийные экшены при провижене CI стоит запинить на commit SHA.
      - uses: actions/checkout@v4.2.2

      - name: Linux deps (X11 for GLFW, lavapipe for headless Vulkan, xvfb)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xorg-dev mesa-vulkan-drivers libvulkan1 vulkan-tools xvfb

      # Гейт 6 требует настоящий WebGPU-адаптер, а на Linux-раннере его даёт единственный
      # программный драйвер — lavapipe. Раньше путь к его ICD был прошит строкой в трёх местах:
      # промахнись имя файла — загрузчик Vulkan не находит НИ ОДНОГО драйвера и молча отдаёт
      # пустой список адаптеров, а движок сообщает «no suitable adapter» — ошибка окружения,
      # неотличимая от ошибки кода. Поэтому ICD ищется, проверяется через vulkaninfo и кладётся
      # в окружение job'а один раз: дальше его наследуют все шаги.
      - name: Vulkan ICD (Linux) — resolve lavapipe and prove the loader sees it
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ls -la /usr/share/vulkan/icd.d/ || true
          ICD=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json 2>/dev/null | head -1)
          [ -n "$ICD" ] || { echo "lavapipe ICD is not installed"; exit 1; }
          echo "VK_ICD_FILENAMES=$ICD" >> "$GITHUB_ENV"
          VK_ICD_FILENAMES="$ICD" vulkaninfo --summary > vk.txt 2>&1 || true
          head -40 vk.txt
          grep -qi 'llvmpipe\|lavapipe' vk.txt || {
            echo "--- full vulkaninfo output ---"; cat vk.txt
            echo "lavapipe is installed but invisible to the Vulkan loader"; exit 1; }
          echo "vulkan: PASS (lavapipe via $ICD)"

      # Линтер workflow держится в CI по той же причине, по которой написан: правило, которое
      # локально забыли запустить, не защищает ни от чего. Проверка статическая — хватает одной ОС.
      # --selftest отдельным вызовом, чтобы в логе был виден список правил, а не только вердикт.
      - name: Workflow lint — портируемость шагов, вакуумные гейты
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python3 scripts/ci_lint.py --selftest
          python3 scripts/ci_lint.py

      # Правило 5 (лимит длины файла) до этого раунда жило только текстом в CLAUDE.md, и результат
      # виден по дереву: тринадцать файлов за мягкими 200, а сам `preflight.sh` дорос до 297 при
      # жёстких 250. Лимит, который не проверяет никто, лимитом не является. Разрешение выше мягкого
      # порога пишется строкой в `scripts/line_budget_allow.py` — с потолком, видом обоснования из
      # закрытого списка и причиной словами; жёсткий порог причиной не выкупается.
      # Проверка статическая, дерево одно — хватает одной ОС. `--selftest` отдельным вызовом, чтобы
      # в логе был список правил: сломанное правило молчит неотличимо от чистого дерева.
      - name: File-length budget — soft limit needs a written reason, hard limit is absolute
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python3 scripts/line_budget.py --selftest
          python3 scripts/line_budget.py

      # Инвариант 2 спеки #12: условная компиляция по ОС живёт ТОЛЬКО в engine/platform/*.
      # Тела всех четырёх статических гейтов — в scripts/tree_invariants.sh: тот же скрипт гоняет
      # preflight, поэтому нарушение видно до push, а не через двадцать минут на трёх ОС.
      # Шаги остаются раздельными, чтобы в логе было названо, какой именно инвариант сломан.
      # Один раннер: результат от ОС не зависит, дерево одно.
      - name: Platform — no OS #ifdef outside engine/platform (spec #12 invariant 2)
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/tree_invariants.sh seam

      # Тот же инвариант 2, вторая его половина: узкий argv MSVC перекодирован в системную
      # ANSI-кодовую страницу, и юникод-аргумент разрушается ДО входа в шов файловой системы.
      # Единственный легальный источник argv — platform::Args; забыть его в новом main молча
      # нельзя, греп ловит это до сборки (гейт 8 спеки поймал бы только post factum и только там,
      # где путь юникодный).
      - name: Platform — argv only through platform::Args (spec #12 invariant 2)
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/tree_invariants.sh argv

      # Третья половина того же инварианта. std::getenv отдаёт на Windows ANSI-строку, поэтому
      # `LIKENES_ASSETS=D:\юникод тест-каталог\` приезжает с подменёнными символами, а MSVC вдобавок
      # помечает его C4996 и толкает к `_dupenv_s` — то есть к #ifdef в переносимом коде.
      # Единственный легальный источник — platform::env_var; забыть шов в новом TU ловит греп.
      - name: Platform — env only through the platform_env seam (spec #12 invariant 2)
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/tree_invariants.sh env

      # Рантайм-вывод — чистый ASCII. Консоль Windows не UTF-8, и русская строка из процесса
      # приезжает владельцу как «bye тАФ overlay in memory»: дефект четыре раза находился глазами
      # в отчёте о ручном гейте, то есть после самого дорогого круга в проекте. Комментарии это
      # не трогает — правило разбирает литералы, а не строки файла.
      - name: Platform — runtime output stays ASCII (Windows console is not UTF-8)
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/tree_invariants.sh ascii

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: MSVC env (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DAUDIO_MINIAUDIO=OFF -DPLUGIN_UI=OFF -DPLUGIN_WASM=OFF

      # Тот же скрипт, что и в pre-commit hook (.context/checks.json): ноль ошибок и ноль
      # предупреждений на всех трёх компиляторах. Локально видно только clang — gcc и MSVC
      # ловятся здесь, и ловятся ошибкой сборки, а не строкой в логе, которую никто не читает.
      # Набор целей здесь headless (шаг Configure выше) — отсюда LIKE_NES_BUILD_SUBSET; imgui и
      # miniaudio собираются своими шагами ниже, тоже через этот скрипт, но каждый в своём каталоге
      # и одной целью. Wasm-гейт требует wasmtime C-API в deps/, которого на раннерах нет: он
      # остаётся локальным. Вызов через `bash`, а не по exec-биту:
      # git-bash на Windows-раннере exec-бит из индекса не наследует.
      - name: Build (набор целей CI) — cross-OS build validation, zero warnings
        shell: bash
        env:
          LIKE_NES_BUILD_SUBSET: "1"
        run: bash scripts/build_check.sh

      - name: Determinism — golden-hash must match across OS/compilers
        shell: bash
        run: |
          BIN=$(find build -maxdepth 2 -type f \( -name 'determinism_test' -o -name 'determinism_test.exe' \) | head -1)
          echo "binary: $BIN"
          "$BIN" | tee out.txt
          grep -q "0x6c4b121dbb47d13b" out.txt || { echo "GOLDEN HASH MISMATCH on ${{ matrix.os }}"; exit 1; }
          grep -q "run1==run2: YES" out.txt

      # Греп выше доказывает, что окружение читают только через шов, но не что шов читает верно.
      # Обе реализации возвращают строку, и битое значение неотличимо от «переменная не задана»:
      # молчаливое расхождение ровно того класса, ради которого раунд и затевался. Тест сам
      # выставляет ручки — кириллицу и значение длиннее стартового буфера.
      - name: Platform — env seam round-trip (unicode, resize branch, unset)
        shell: bash
        run: |
          E=$(find build -maxdepth 2 -type f \( -name 'platform_env_test' -o -name 'platform_env_test.exe' \) | head -1)
          [ -n "$E" ] || { echo "platform_env_test not built on ${{ matrix.os }}"; exit 1; }
          "$E" | tee env_seam.txt
          grep -q "platform-env: PASS" env_seam.txt

      # Шов platform_process (спека #12): CreateProcessW принимает ОДНУ строку, которую дочерний
      # процесс парсит обратно через CommandLineToArgvW. Ошибка цитирования тихая — аргумент
      # уезжает в соседний слот. Round-trip прогоняется настоящим парсером ОС.
      - name: Platform — win32 argv quoting round-trip (CommandLineToArgvW)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          Q=$(find build -maxdepth 2 -type f -name 'win32_cmdline_test.exe' | head -1)
          [ -n "$Q" ] || { echo "win32_cmdline_test not built"; exit 1; }
          "$Q" | tee cmdline.txt
          grep -q "PASS" cmdline.txt

      # Гейт 8 спеки #12: кириллица и пробел в пути — не косметика, а другие API. Узкий fopen на
      # Windows идёт через ANSI-кодовую страницу и на кириллице открывает не тот файл или ничего,
      # поэтому весь ввод-вывод уведён в шов platform_io (_wfopen/CreateFileW по UTF-16). Пробел
      # бьёт по второму шву: CreateProcessW склеивает argv в ОДНУ строку, и непроцитированный
      # пробел рвёт путь пополам. Прогон из каталога с обоими символами закрывает три поверхности:
      # assetc пишет бандл (golden обязан совпасть с гейтом #1 — путь не влияет на байты),
      # asset_test читает его mmap'ом, а ach_crash_test перезапускает СЕБЯ через platform::exe_path
      # → Child, то есть отдаёт ОС собственный путь с пробелом и кириллицей обратно в argv.
      - name: Platform — unicode + space in path (bake, mmap, self-respawn; gate #8)
        shell: bash
        run: |
          need() { [ -n "$1" ] || { echo "$2 not built on ${{ matrix.os }}"; exit 1; }; }
          A=$(find build -maxdepth 2 -type f \( -name 'assetc' -o -name 'assetc.exe' \) | head -1)
          T=$(find build -maxdepth 2 -type f \( -name 'asset_test' -o -name 'asset_test.exe' \) | head -1)
          C=$(find build -maxdepth 2 -type f \( -name 'ach_crash_test' -o -name 'ach_crash_test.exe' \) | head -1)
          need "$A" assetc; need "$T" asset_test; need "$C" ach_crash_test
          rm -rf "юникод тест-каталог" && mkdir "юникод тест-каталог"
          cp "$A" "$T" "$C" "юникод тест-каталог/"
          cd "юникод тест-каталог"
          ./"$(basename "$A")" --synthetic "синтетика тест.bundle" | tee syn_u.txt
          grep -q "0xf2255dc74fbdb6bc" syn_u.txt \
            || { echo "UNICODE PATH CHANGED THE BAKE on ${{ matrix.os }}"; exit 1; }
          ./"$(basename "$T")" "синтетика тест.bundle" | tee asset_u.txt
          grep -q "\[asset_test\] PASS" asset_u.txt
          ./"$(basename "$C")" | tee crash_u.txt
          # tr -d '\r': CRT MSVC держит stdout в text-режиме и в пайп тоже пишет \r\n, поэтому
          # якорь конца строки не совпал бы с «PASS\r». Якорь нужен: без него grep поймал бы
          # «PASS» внутри любой промежуточной строки отчёта.
          tr -d '\r' < crash_u.txt | grep -qx "PASS"

      # Гейт 1 (воспр. билд) — per-triple same-host. Один раннер (ubuntu): cross-OS байт-идентичность =
      # non-goal (ADR 0008), а +2 полных билда × 3 ОС рискуют timeout-minutes:30. macOS проверен локально
      # (нативно, 181 арт. 0 diffs); Windows/MSVC-детерминизм = follow-up.
      - name: Reproducible build (Gate 1) — build-twice on different paths, cmp byte-identical
        if: runner.os == 'Linux'
        shell: bash
        env:
          SOURCE_DATE_EPOCH: '1700000000'
          ZERO_AR_DATE: '1'
        run: |
          A=/tmp/repro-a
          B=/tmp/repro-bbbbbbbbbbbbbbbb
          for D in "$A" "$B"; do
            rm -rf "$D"
            cmake -S . -B "$D" -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DAUDIO_MINIAUDIO=OFF -DPLUGIN_UI=OFF -DPLUGIN_WASM=OFF -DINPUT_NATIVE=OFF
            cmake --build "$D" --target game_sidescroller
          done
          d=0; t=0
          while IFS= read -r f; do
            rel="${f#$A/}"
            if [ ! -f "$B/$rel" ]; then echo "MISSING in B: $rel"; d=$((d+1)); continue; fi
            t=$((t+1)); cmp -s "$f" "$B/$rel" || { echo "DIFF: $rel"; d=$((d+1)); }
          done < <(find "$A" \( -name '*.o' -o -name '*.a' \) -o -type f -name 'game_sidescroller')
          echo "repro on ${{ matrix.os }}: compared=$t diffs=$d"
          [ "$t" -gt 0 ] || { echo "no artifacts compared — vacuous gate"; exit 1; }
          [ "$d" -eq 0 ] || { echo "REPRO MISMATCH on ${{ matrix.os }}"; exit 1; }

      # Загружаемый модуль ищем по КОНКРЕТНЫМ расширениям: на Windows рядом с game_a.dll лежат
      # game_a.lib/.exp/.pdb, и glob 'game_a.*' затащил бы их в argv.
      - name: Hot-reload PoC — state-in-host + reload + crash isolation
        shell: bash
        run: |
          mod() { find build -maxdepth 2 -type f \( -name "$1.so" -o -name "$1.dylib" -o -name "$1.dll" \) | head -1; }
          H=$(find build -maxdepth 2 -type f \( -name 'hotreload_host' -o -name 'hotreload_host.exe' \) | head -1)
          [ -n "$H" ] || { echo "hotreload_host not built"; exit 1; }
          "$H" "$(mod game_a)" "$(mod game_b)" "$(mod game_crash)" | tee hr.txt
          grep -q "hot-reload PoC: PASS" hr.txt

      - name: Render smoke (Linux, lavapipe+xvfb) — best-effort
        if: runner.os == 'Linux'
        continue-on-error: true
        run: xvfb-run -a ./build/core_smoke

      - name: Render smoke (macOS, native Metal) — best-effort
        if: runner.os == 'macOS'
        continue-on-error: true
        run: ./build/core_smoke

      # Единственное место, где imgui вообще собирается в CI, и нужен он ровно ради гейта: шесть
      # TU imgui вендоренные, а wgpu_imgui.cpp в той же цели — наш и строгий. Пара «чужой объект
      # рядом с нашим» под MSVC не собиралась никогда, а именно на ней ломался прежний механизм
      # глушения (D9025). Цель одна: собирать ради этого дерево второй раз на трёх ОС незачем.
      # Вакуумным шаг не станет: без PLUGIN_UI цели `imgui` не существует, и сборка падает громко.
      - name: UI — imgui vendored objects build clean (PLUGIN_UI on, zero warnings)
        shell: bash
        run: |
          cmake -S . -B build-ui -G Ninja -DCMAKE_BUILD_TYPE=Release -DPLUGIN_UI=ON \
            -DAUDIO_MINIAUDIO=OFF -DPLUGIN_WASM=OFF
          BUILD_DIR=build-ui LIKE_NES_BUILD_SUBSET=1 LIKE_NES_BUILD_TARGETS=imgui \
            bash scripts/build_check.sh

      # Offscreen render-вертикаль (спека #2): headless, без окна. --selftest доказывает
      # воспроизводимость offscreen-пути (epsilon run-to-run) БЕЗ вендор-лока. Побайтовый
      # golden между вендорами недостижим (ADR): committed-golden epsilon-гейт валидируется
      # локально на пиннутой Metal-среде; портируемый lavapipe-golden — follow-up.
      - name: Render vertical selftest (Linux, lavapipe) — best-effort
        if: runner.os == 'Linux'
        continue-on-error: true
        shell: bash
        run: |
          BIN=$(find build -maxdepth 2 -type f -name 'render_golden' | head -1)
          [ -n "$BIN" ] || { echo "render_golden not found"; exit 1; }
          "$BIN" --selftest

      - name: Render vertical selftest (macOS, Metal) — best-effort
        if: runner.os == 'macOS'
        continue-on-error: true
        shell: bash
        run: |
          BIN=$(find build -maxdepth 2 -type f -name 'render_golden' | head -1)
          [ -n "$BIN" ] || { echo "render_golden not found"; exit 1; }
          "$BIN" --selftest

      # --- Ассет-вертикаль (спека #5) — tools-free гейты на всех 3 ОС ---
      # Полный бейк (tint+basisu) + шов asset→render — локальный pinned-T4 (тулчейн не на
      # раннерах), как perceptual-golden render-PoC. CI гоняет детерм. синтетик (writer+zstd,
      # zstd ПИННУТ v1.5.6 → cross-machine байт-golden) + гейты #2/#3 + hot-reload + ASan.
      - name: Asset — synthetic byte-golden bake (gate #1, cross-OS writer+zstd)
        shell: bash
        run: |
          A=$(find build -maxdepth 2 -type f \( -name 'assetc' -o -name 'assetc.exe' \) | head -1)
          [ -n "$A" ] || { echo "assetc not built"; exit 1; }
          "$A" --synthetic syn.bundle | tee syn.txt
          grep -q "0xf2255dc74fbdb6bc" syn.txt || { echo "SYNTH HASH MISMATCH on ${{ matrix.os }}"; exit 1; }
          "$A" --synthetic syn2.bundle >/dev/null
          # cmp, а не хеш: git-bash на Windows-раннере не несёт ни shasum, ни md5sum, а сверяем мы
          # байтовое равенство двух локальных файлов — хеш тут лишний посредник.
          cmp -s syn.bundle syn2.bundle || { echo "bake not run-to-run identical"; exit 1; }

      # Бандл игры закоммичен готовым, и перепечь его целиком на раннере нечем: текстурная секция
      # тянет tint и basisu, которых тут нет. Сверяются секции, что пекутся чистыми парсерами —
      # правка input.txt, achievements.txt или movement.txt без перепекания иначе доезжает молча,
      # а на бандле
      # стоят и игра-образец, и sim-golden. Гейт несёт собственный позитивный контроль: испорченная
      # копия таблицы обязана быть отбита тем же сравнением, иначе он зелен вакуумно.
      - name: Asset — committed game.bundle matches its sources (tool-free sections, all OS)
        shell: bash
        run: |
          A=$(find build -maxdepth 2 -type f \( -name 'assetc' -o -name 'assetc.exe' \) | head -1)
          [ -n "$A" ] || { echo "assetc not built"; exit 1; }
          "$A" --verify-game example_ugly_game/assets example_ugly_game/assets/game.bundle | tee vg.txt
          # Код возврата не различает «всё сошлось» и «сверять было нечего»: выпади секция из списка
          # SECTIONS — правкой, конфликтом мержа, временным комментарием, — бинарь честно напечатает
          # меньшее число и вернёт ноль, а половина гейта выключится молча. Ассертится строка ВМЕСТЕ
          # с числом: список секций растёт осознанно, вместе с этой строкой.
          grep -q "verify: PASS - 4 tool-free section(s)" vg.txt || { echo "verify-game checked the wrong number of sections (or failed)"; exit 1; }

      - name: Asset — gate #2 (zero-copy / no per-frame heap) + gate #3 + hot-reload
        shell: bash
        run: |
          T=$(find build -maxdepth 2 -type f \( -name 'asset_test' -o -name 'asset_test.exe' \) | head -1); "$T" syn.bundle
          D=$(find build -maxdepth 2 -type f \( -name 'asset_determinism_test' -o -name 'asset_determinism_test.exe' \) | head -1); "$D" syn.bundle
          H=$(find build -maxdepth 2 -type f \( -name 'asset_hot_reload_test' -o -name 'asset_hot_reload_test.exe' \) | head -1); "$H" .

      - name: Asset — ASan/UBSan (gate #2 memory-safety, Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ZLIB=$(find build -type f -name 'libzstd.a' | head -1)
          ZINC=$(find build -maxdepth 4 -path '*zstd-src/lib' -type d | head -1)
          c++ -std=gnu++20 -fsanitize=address,undefined -fno-omit-frame-pointer -g -O1 \
            -Iengine/asset -Iengine/platform -I"$ZINC" \
            engine/asset/asset_test.cpp engine/asset/asset_manager.cpp \
            engine/platform/platform_io_posix.cpp engine/asset/bundle_view.cpp \
            engine/platform/platform_args.cpp engine/platform/platform_args_posix.cpp \
            "$ZLIB" -lpthread -o asset_test_san
          ./asset_test_san syn.bundle

      # --- Аудио-вертикаль (спека #3) — deviceless-гейты на всех трёх ОС ---
      # Реальное устройство (miniaudio --play) — локальный pinned-T4 (как perceptual-golden
      # render-PoC). CI гоняет: байт-golden микса (Fix32, целочисл. → cross-machine), детерм.-гейт
      # (тайминг callback не течёт в sim), RT-safety, шов (реальный vorbis-декод stb_vorbis, offline).
      - name: Audio — mix byte-golden (gate #1) + determinism (gate #2) + RT-safety (gate #3)
        shell: bash
        run: |
          G=$(find build -maxdepth 2 -type f \( -name 'audio_golden' -o -name 'audio_golden.exe' \) | head -1)
          "$G" | tee ag.txt
          grep -q "0x2cf5b5597afa3241" ag.txt || { echo "AUDIO MIX GOLDEN MISMATCH on ${{ matrix.os }}"; exit 1; }
          D=$(find build -maxdepth 2 -type f \( -name 'audio_determinism_test' -o -name 'audio_determinism_test.exe' \) | head -1); "$D"
          R=$(find build -maxdepth 2 -type f \( -name 'audio_rt_test' -o -name 'audio_rt_test.exe' \) | head -1); "$R"

      - name: Audio — seam asset->audio (real vorbis decode via stb_vorbis, offline)
        shell: bash
        run: |
          A=$(find build -maxdepth 2 -type f \( -name 'assetc' -o -name 'assetc.exe' \) | head -1)
          "$A" --audio engine/audio/assets/src audio.bundle
          S=$(find build -maxdepth 2 -type f \( -name 'audio_seam' -o -name 'audio_seam.exe' \) | head -1)
          "$S" audio.bundle

      # Гейт 2 спеки #12 — машинный суррогат «живого звука»: у раннеров аудиоустройства нет,
      # поэтому берём null-бэкенд miniaudio. Он поднимает НАСТОЯЩИЙ ma_device и его RT-поток,
      # так что тракт device→callback→mixer→ring проверяется целиком; на Windows это ещё и
      # доказательство, что WASAPI-ветка компилится и линкуется под MSVC. Что суррогат НЕ
      # проверяет — само железо; сенсорное подтверждение остаётся follow-up'ом на HW владельца.
      - name: Audio — device path via miniaudio null backend (gate #2 surrogate)
        shell: bash
        run: |
          # Отдельный каталог, а не переконфигурация общего build: у шага свой набор опций
          # (-DAUDIO_MINIAUDIO=ON), и подменённый посреди джоба кэш рассинхронизировал бы кэш с
          # двумя десятками уже собранных бинарей, которые запускают шаги ниже.
          cmake -S . -B build-audio -G Ninja -DCMAKE_BUILD_TYPE=Release -DAUDIO_MINIAUDIO=ON \
            -DPLUGIN_UI=OFF -DPLUGIN_WASM=OFF
          # Через гейт, а не голым `cmake --build`: реализация miniaudio — вендоренный TU, и его
          # глушение проверяется только на MSVC (D9025 — предупреждение драйвера, мимо /WX).
          # Собранное голым вызовом уезжало в лог, которого никто не читает.
          BUILD_DIR=build-audio LIKE_NES_BUILD_SUBSET=1 LIKE_NES_BUILD_TARGETS=audio_seam \
            bash scripts/build_check.sh
          S=$(find build-audio -maxdepth 2 -type f \( -name 'audio_seam' -o -name 'audio_seam.exe' \) | head -1)
          "$S" audio.bundle --device-selftest | tee adev.txt
          grep -q "\[audio_seam\] PASS" adev.txt

      - name: Audio — ASan/UBSan (gates #1/#3) + TSan (gate #2), Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # -Iengine/platform: проба берёт оттуда PLATFORM_NOINLINE — условная компиляция живёт
          # только за швом. Шаг зовёт компилятор напрямую, мимо CMake, поэтому include-пути
          # целей сюда не приезжают: их приходится повторять руками.
          c++ -std=gnu++20 -fsanitize=address,undefined -fno-omit-frame-pointer -g -O1 -Iengine/platform \
            engine/audio/audio_rt_test.cpp engine/audio/mixer.cpp -o audio_rt_san && ./audio_rt_san
          c++ -std=gnu++20 -fsanitize=address,undefined -fno-omit-frame-pointer -g -O1 \
            engine/audio/audio_golden_main.cpp engine/audio/mixer.cpp -o audio_golden_san && ./audio_golden_san
          c++ -std=gnu++20 -fsanitize=thread -g -O1 -pthread \
            engine/audio/audio_determinism_test.cpp engine/audio/mixer.cpp -o audio_det_tsan && ./audio_det_tsan

      # --- Ввод-вертикаль (спека #4) — deviceless-гейты на ВСЕХ ОС ---
      # Native-бэкенды (XInput/GameController/evdev) + GLFW-пумп собираются в CI через таргет
      # input_demo (по одному на ОС) — компиляционная валидация. Реальные устройства + rumble =
      # локальный pinned-T4 на owner-HW (macOS+Xbox), как perceptual-golden render / miniaudio --play.
      - name: Input — determinism golden (gate #1, integer/fix32 → cross-machine) + poll-rate indep + replay
        shell: bash
        run: |
          BIN=$(find build -maxdepth 2 -type f \( -name 'input_determinism_test' -o -name 'input_determinism_test.exe' \) | head -1)
          [ -n "$BIN" ] || { echo "input_determinism_test not built"; exit 1; }
          "$BIN" | tee id.txt
          grep -q "0xcc26a1897a326f6f" id.txt || { echo "INPUT DETERMINISM GOLDEN MISMATCH on ${{ matrix.os }}"; exit 1; }
          grep -q "input-determinism: PASS" id.txt

      - name: Input — action-map layer (contexts/consume, rebind, per-player, buffer) + rt-safety (gate #3)
        shell: bash
        run: |
          AM=$(find build -maxdepth 2 -type f \( -name 'input_actionmap_test' -o -name 'input_actionmap_test.exe' \) | head -1); "$AM"
          RT=$(find build -maxdepth 2 -type f \( -name 'input_rt_test' -o -name 'input_rt_test.exe' \) | head -1); "$RT"

      - name: Input — race/timing-independence (gate #2, one-way SPSC)
        shell: bash
        run: |
          RC=$(find build -maxdepth 2 -type f \( -name 'input_race_test' -o -name 'input_race_test.exe' \) | head -1); "$RC"

      - name: Input — ASan/UBSan (gates #1/#3, action-map) + TSan (gate #2 race), Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # -Iengine/platform: rt-проба берёт оттуда PLATFORM_NOINLINE (см. audio-шаг выше).
          SAN="-fsanitize=address,undefined -fno-omit-frame-pointer -g -O1 -Iengine -Iengine/platform -std=gnu++20"
          c++ $SAN engine/input/action_map.cpp engine/input/input_determinism_test.cpp -o input_det_san && ./input_det_san
          c++ $SAN engine/input/action_map.cpp engine/input/input_rt_test.cpp -o input_rt_san && ./input_rt_san
          c++ $SAN engine/input/action_map.cpp engine/input/input_actionmap_test.cpp -o input_am_san && ./input_am_san
          c++ -std=gnu++20 -fsanitize=thread -g -O1 -Iengine -pthread \
            engine/input/action_map.cpp engine/input/input_race_test.cpp -o input_race_tsan && ./input_race_tsan

      # --- Плагин-вертикаль (спека #6) — determinism/seam/isolation/manifest на ВСЕХ 3 ОС: спека
      # #12 увела загрузку и крэш-изоляцию за швы platform_module/platform_guard (dlopen+сигналы
      # против LoadLibraryExW+SEH), и «Windows SEH — follow-up» здесь больше не действует.
      # Determinism golden (fix32, целочисл.) сверяется cross-arch (macOS ARM ≡ Linux x86_64).
      # WASM-sandbox (gate #5) + live UI-shell — follow-up (тулчейн/owner-HW), как miniaudio --play.
      - name: "Plugin — determinism golden sim-hash (gate #1: order-independent + plugin-effect + cross-arch)"
        shell: bash
        run: |
          mod() { find build -maxdepth 2 -type f \( -name "$1.so" -o -name "$1.dylib" -o -name "$1.dll" \) | head -1; }
          DT=$(find build -maxdepth 2 -type f \( -name 'plugin_determinism_test' -o -name 'plugin_determinism_test.exe' \) | head -1)
          [ -n "$DT" ] || { echo "plugin_determinism_test not built"; exit 1; }
          "$DT" "$(mod plugin_gravity)" "$(mod plugin_wind)" | tee pd.txt
          grep -q "0x7d9a6e60cbed4156" pd.txt || { echo "PLUGIN DETERMINISM GOLDEN MISMATCH on ${{ matrix.os }}"; exit 1; }
          grep -q "plugin-determinism: PASS" pd.txt

      - name: Plugin — seam (asset-codec decode + all 6 ext-point kinds registered, gate #4)
        shell: bash
        run: |
          mod() { find build -maxdepth 2 -type f \( -name "$1.so" -o -name "$1.dylib" -o -name "$1.dll" \) | head -1; }
          ST=$(find build -maxdepth 2 -type f \( -name 'plugin_seam_test' -o -name 'plugin_seam_test.exe' \) | head -1)
          [ -n "$ST" ] || { echo "plugin_seam_test not built"; exit 1; }
          "$ST" "$(mod plugin_gravity)" "$(mod plugin_rle_codec)" "$(mod plugin_multi)" | tee ps.txt
          grep -q "plugin-seam: PASS" ps.txt

      - name: Plugin — crash isolation + hot-reload swap (gates #2/#3, signal/SEH isolation)
        shell: bash
        run: |
          mod() { find build -maxdepth 2 -type f \( -name "$1.so" -o -name "$1.dylib" -o -name "$1.dll" \) | head -1; }
          IT=$(find build -maxdepth 2 -type f \( -name 'plugin_isolation_test' -o -name 'plugin_isolation_test.exe' \) | head -1)
          [ -n "$IT" ] || { echo "plugin_isolation_test not built"; exit 1; }
          "$IT" "$(mod plugin_gravity)" "$(mod plugin_wind)" "$(mod plugin_crash)" | tee pi.txt
          grep -q "plugin-isolation: PASS" pi.txt

      - name: Plugin — configurable UI manifest gate (data->panels/docking, all OS)
        shell: bash
        run: |
          MT=$(find build -maxdepth 2 -type f \( -name 'plugin_manifest_test' -o -name 'plugin_manifest_test.exe' \) | head -1)
          [ -n "$MT" ] || { echo "plugin_manifest_test not built"; exit 1; }
          "$MT" engine/plugin/manifests/inspector.manifest engine/plugin/manifests/console.manifest engine/plugin/manifests/bad.manifest | tee pm.txt
          grep -q "plugin-manifest: PASS" pm.txt

      - name: Plugin — ASan/UBSan (loader/registry/probe + manifest robustness, Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Эти сборки собирают дерево вручную, минуя CMake, поэтому исходники швов приходится
          # перечислять самим — иначе шаг падает на первом же `platform_*.hpp: No such file`.
          SAN="-fsanitize=address,undefined -fno-omit-frame-pointer -g -O1 -std=gnu++20 -Iengine/plugin -Iengine/core -Iengine/platform"
          # ci-lint: mirrors-group seam-fs
          PLAT_FS="engine/platform/platform_fs.cpp engine/platform/platform_fs_posix.cpp engine/platform/platform_path_posix.cpp engine/platform/platform_env_posix.cpp"
          # ci-lint: mirrors-group seam-args
          PLAT_ARGS="engine/platform/platform_args.cpp engine/platform/platform_args_posix.cpp"
          # ci-lint: mirrors-group seam-mod
          PLAT_MOD="engine/platform/platform_module_posix.cpp engine/platform/platform_guard_posix.cpp"
          c++ $SAN engine/plugin/manifest.cpp engine/plugin/plugin_manifest_test.cpp $PLAT_FS $PLAT_ARGS -o plugin_manifest_san
          ./plugin_manifest_san engine/plugin/manifests/inspector.manifest engine/plugin/manifests/console.manifest engine/plugin/manifests/bad.manifest
          c++ $SAN -shared -fPIC engine/plugin/plugins/gravity.cpp -o plugin_gravity_san.so
          c++ $SAN -shared -fPIC engine/plugin/plugins/wind.cpp -o plugin_wind_san.so
          c++ $SAN engine/plugin/registry.cpp engine/plugin/host.cpp engine/plugin/builtin.cpp engine/plugin/manifest.cpp \
            engine/plugin/plugin_determinism_test.cpp $PLAT_FS $PLAT_ARGS $PLAT_MOD -ldl -o plugin_det_san
          ./plugin_det_san ./plugin_gravity_san.so ./plugin_wind_san.so | tee pdsan.txt
          grep -q "plugin-determinism: PASS" pdsan.txt

      # Гейт 7 спеки #12: санитайзеры на Windows. Решение владельца — MSVC основной, санитарит
      # clang-cl: у него MSVC-ABI (линкуется с тем же деревом), а рантайм ASan идёт вместе с ним.
      # Отдельный build-каталог, а не флаг поверх основного: инструментировать надо и зависимости
      # (zstd в ассет-пути), иначе аллокации чужого кода ASan не видит. UBSan сюда не входит —
      # рантайма UBSan под MSVC-таргет у clang нет; UBSan остаётся на Linux-шагах выше, и это
      # разница в покрытии, а не отключённый гейт. Сами тесты — те же, что Linux санитарит
      # отдельными TU: ассет-путь (mmap-вью + zstd), аудио-микс и загрузчик плагинов.
      - name: Asset/Audio/Plugin — ASan on Windows (clang-cl, gate #7)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # Каталог LLVM не зашиваем: он версионируется вместе с образом раннера, и жёсткий путь
          # превратил бы обновление образа в красный гейт. Ищем сами, добавляя штатное место
          # установки как последний кандидат.
          command -v clang-cl >/dev/null || export PATH="/c/Program Files/LLVM/bin:$PATH"
          command -v clang-cl >/dev/null || { echo "clang-cl not found on the runner"; exit 1; }
          clang-cl --version
          # `clang -print-runtime-dir` называет per-target каталог (…/lib/x86_64-pc-windows-msvc),
          # которого в официальной сборке LLVM для Windows нет: она до сих пор раскладывает
          # рантаймы плоско в …/lib/windows. Поэтому каталог не берётся со слов компилятора, а
          # ищется по файлу, ради которого нужен: существующий, но пустой каталог дал бы LNK1104
          # страницей ниже вместо внятного отказа здесь.
          # Проверяются ровно те две библиотеки, которые ниже уезжают на линкер: каталог,
          # где лежит одна из них, но не обе, — не тот каталог.
          ASAN_LIBS="clang_rt.asan_dynamic-x86_64.lib clang_rt.asan_dynamic_runtime_thunk-x86_64.lib"
          RT=""
          for c in "$(clang -print-runtime-dir)" "$(clang -print-resource-dir)/lib/windows"; do
            missing=""
            for l in $ASAN_LIBS; do [ -f "$c/$l" ] || missing="$missing $l"; done
            if [ -z "$missing" ]; then RT=$c; break; fi
            echo "in $c missing:$missing"
          done
          if [ -z "$RT" ]; then
            echo "clang asan runtime not found"
            ls -R "$(clang -print-resource-dir)/lib" 2>/dev/null | head -50
            exit 1
          fi
          # Две разные надобности одного каталога, и обе обязательны. Линковка: линкер ищет
          # библиотеки рантайма по %LIB% — не найдёт, будет LNK1104 вместо санитайзера. Запуск:
          # рантайм ASan здесь DLL, и без неё инструментированный exe не стартует вовсе.
          # Присваивание отдельно от export: в связке `export X=$(...)` код возврата подстановки
          # теряется, и провал cygpath уехал бы в невнятную ошибку линкера страницей ниже.
          RT_WIN=$(cygpath -w "$RT")
          RT_UNIX=$(cygpath -u "$RT")
          export LIB="${RT_WIN}${LIB:+;$LIB}"
          export PATH="${RT_UNIX}:$PATH"
          # Рантайм называется линкеру явно, потому что линкует CMake через lld-link напрямую,
          # минуя драйвер clang-cl: `-fsanitize=address` доходит только до компиляции, а объекты
          # уносят ссылку на `__asan_init` и ничего больше — отсюда `undefined symbol` вместо
          # LNK1104. `/wholearchive` на thunk обязателен: без него линкер выбросит секции с
          # перехватчиками как неиспользуемые, и санитайзер промолчит на живом переполнении.
          # Три переменные, а не одна: плагины — DLL (SHARED), тестовые бинари — EXE.
          LINK_ASAN="$ASAN_LIBS -wholearchive:clang_rt.asan_dynamic_runtime_thunk-x86_64.lib"
          # CMAKE_CXX_FLAGS не дополняет умолчание, а ЗАМЕНЯЕТ его, поэтому вместе с санитайзером
          # приходится повторить то, что CMake кладёт туда сам: `EHsc` (без него `try` в
          # manifest.cpp — `error: cannot use 'try' with exceptions disabled`) и пару дефайнов
          # WIN32/_WINDOWS, на которые смотрят системные заголовки.
          # Форма флагов — через дефис, а не слэш: шелл шага — git-bash, и он превращает аргумент,
          # начинающийся со слэша, в путь Windows (`/DWIN32` → `C:/Program Files/Git/DWIN32`).
          # Отказ при этом выглядит как «cannot specify /Fo when compiling multiple source files»,
          # а не как испорченный флаг. clang-cl понимает обе формы, git-bash — только одну.
          # Модель CRT задаётся явно, потому что ASan не умеет отладочный рантайм вовсе:
          # `invalid argument '-MDd' not allowed with '-fsanitize=address'`. Умолчание
          # CMAKE_MSVC_RUNTIME_LIBRARY генвыражением подставляет `-MDd` в конфигурации Debug,
          # а проверка компилятора внутри project() идёт именно в Debug — не в том типе сборки,
          # что заказан флагом. Поэтому обе ручки: одна снимает `d` с CRT, вторая уводит
          # проверку из Debug (иначе к ней приезжает ещё и `/RTC1`, тоже несовместимый).
          cmake -S . -B build-asan -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL \
            -DCMAKE_TRY_COMPILE_CONFIGURATION=RelWithDebInfo \
            -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl \
            -DCMAKE_C_FLAGS="-DWIN32 -D_WINDOWS -fsanitize=address" \
            -DCMAKE_CXX_FLAGS="-DWIN32 -D_WINDOWS -EHsc -fsanitize=address" \
            -DCMAKE_EXE_LINKER_FLAGS="$LINK_ASAN" \
            -DCMAKE_SHARED_LINKER_FLAGS="$LINK_ASAN" \
            -DCMAKE_MODULE_LINKER_FLAGS="$LINK_ASAN" \
            -DAUDIO_MINIAUDIO=OFF -DPLUGIN_UI=OFF -DPLUGIN_WASM=OFF -DINPUT_NATIVE=OFF -DIDE_POC=OFF
          cmake --build build-asan --target asset_test asset_determinism_test \
            audio_golden audio_rt_test plugin_determinism_test plugin_gravity plugin_wind
          find build-asan -maxdepth 2 \( -name '*.exe' -o -name '*.dll' \) | sort
          S=build-asan
          "$S/asset_test.exe" syn.bundle
          "$S/asset_determinism_test.exe" syn.bundle | tee asan_det.txt
          grep -q "INVARIANT (PASS)" asan_det.txt
          "$S/audio_golden.exe" | tee asan_audio.txt
          grep -q "0x2cf5b5597afa3241" asan_audio.txt
          "$S/audio_rt_test.exe"
          "$S/plugin_determinism_test.exe" "$S/plugin_gravity.dll" "$S/plugin_wind.dll" | tee asan_plugin.txt
          grep -q "0x7d9a6e60cbed4156" asan_plugin.txt
          grep -q "plugin-determinism: PASS" asan_plugin.txt

      # --- IDE-вертикаль (спека #7), срез 1 — фундамент редактора: flecs scene-doc + детерм.
      # round-trip + undo/redo. Гейт 1 golden (fix32 целочисл., текст ASCII → cross-OS байт-golden,
      # сверяется на всех 3 OS, как input/plugin). Гейт 2 (undo/redo command-bus) — на всех OS.
      # ASan/UBSan (Linux) валидирует память ide-кода. Live UI/Play-процесс/IPC — следующие срезы.
      - name: IDE — scene round-trip byte-golden (gate 1, fix32 integer -> cross-OS) + run-to-run
        shell: bash
        run: |
          BIN=$(find build -maxdepth 2 -type f \( -name 'scene_roundtrip_test' -o -name 'scene_roundtrip_test.exe' \) | head -1)
          [ -n "$BIN" ] || { echo "scene_roundtrip_test not built"; exit 1; }
          "$BIN" | tee ide_rt.txt
          grep -q "0x2de54a36e54e0684" ide_rt.txt || { echo "IDE SCENE GOLDEN MISMATCH on ${{ matrix.os }}"; exit 1; }
          grep -q "scene-roundtrip: PASS" ide_rt.txt

      - name: "IDE — undo/redo command bus (gate 2: do/undo/redo + grouping + redo-truncation)"
        shell: bash
        run: |
          BIN=$(find build -maxdepth 2 -type f \( -name 'command_test' -o -name 'command_test.exe' \) | head -1)
          [ -n "$BIN" ] || { echo "command_test not built"; exit 1; }
          "$BIN" | tee ide_cmd.txt
          grep -q "command-undo: PASS" ide_cmd.txt

      - name: IDE — ASan/UBSan (scene-doc + serialize + command, Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          FLECSLIB=$(find build -type f -name 'libflecs_static.a' | head -1)
          FLECSINC=$(find build -path '*flecs-src/include' -type d | head -1)
          [ -n "$FLECSLIB" ] || { echo "libflecs_static.a not found"; exit 1; }
          SAN="-fsanitize=address,undefined -fno-omit-frame-pointer -g -O1 -std=gnu++20 -Dflecs_STATIC -Itools/ide -Iengine/core -I$FLECSINC"
          c++ $SAN tools/ide/scene_roundtrip_test.cpp tools/ide/scene.cpp tools/ide/serialize.cpp "$FLECSLIB" -pthread -o ide_rt_san
          ./ide_rt_san | tee ide_rt_san.txt
          grep -q "scene-roundtrip: PASS" ide_rt_san.txt
          c++ $SAN tools/ide/command_test.cpp tools/ide/scene.cpp tools/ide/serialize.cpp "$FLECSLIB" -pthread -o ide_cmd_san
          ./ide_cmd_san | tee ide_cmd_san.txt
          grep -q "command-undo: PASS" ide_cmd_san.txt

      # --- IDE-вертикаль срез 2 (спека #7, гейты 3/4/8) — Процесс + IPC. Разделяемую память даёт
      # шов platform_shmem (спека #13, решение 1); fork в play_spawn_test — остаток POSIX-поверхности.
      # seqlock single-writer/
      # multi-reader; крэш child (граница процессов) не роняет parent-редактор; layout-drift → reject;
      # bench shmem vs socket фиксирует транспорт (ADR 0007 гейт 8).
      #
      # Гейт 1 спеки #13: сам шов разделяемой памяти. Обе реализации отдают «получилось» одинаково,
      # поэтому расхождение молчит до прогона — и прогон обязан быть на всех трёх ОС.
      - name: Platform — shared memory seam (spec #13 gate 1, all OS)
        shell: bash
        run: |
          BIN=$(find build -maxdepth 2 -type f \( -name 'platform_shmem_test' -o -name 'platform_shmem_test.exe' \) | head -1)
          [ -n "$BIN" ] || { echo "platform_shmem_test not built on ${{ matrix.os }}"; exit 1; }
          "$BIN" | tee shmem_seam.txt
          grep -q "platform-shmem: PASS" shmem_seam.txt

      - name: Platform — process capture seam (spec #13, all OS)
        shell: bash
        run: |
          BIN=$(find build -maxdepth 2 -type f \( -name 'platform_process_test' -o -name 'platform_process_test.exe' \) | head -1)
          [ -n "$BIN" ] || { echo "platform_process_test not built on ${{ matrix.os }}"; exit 1; }
          "$BIN" | tee process_seam.txt
          grep -q "platform-process: PASS" process_seam.txt

      # Три РАЗНЫЕ по устройству реализации (inotify / FSEvents / ReadDirectoryChangesW) под одним
      # опросным API — сверить их между собой можно только прогоном на каждой ОС. Тест гоняет и
      # нативный бэкенд, и принудительный поллинг: фолбэк иначе не исполнялся бы нигде.
      - name: Platform — directory watch seam (spec #13 decision 4, all OS)
        shell: bash
        run: |
          BIN=$(find build -maxdepth 2 -type f \( -name 'platform_watch_test' -o -name 'platform_watch_test.exe' \) | head -1)
          [ -n "$BIN" ] || { echo "platform_watch_test not built on ${{ matrix.os }}"; exit 1; }
          "$BIN" | tee watch_seam.txt
          grep -q "platform-watch: PASS" watch_seam.txt

      - name: IDE — IPC seqlock self-test (consistent snapshot under contention, all OS)
        shell: bash
        run: |
          BIN=$(find build -maxdepth 2 -type f \( -name 'ide_ipc_selftest' -o -name 'ide_ipc_selftest.exe' \) | head -1)
          [ -n "$BIN" ] || { echo "ide_ipc_selftest not built"; exit 1; }
          "$BIN" | tee ide_seq.txt
          grep -q "ipc-seqlock: PASS" ide_seq.txt

      - name: IDE — Play spawn + read-only mirror 10k + crash isolation + layout-drift (gates 3/4, all OS)
        shell: bash
        run: |
          T=$(find build -maxdepth 2 -type f \( -name 'play_spawn_test' -o -name 'play_spawn_test.exe' \) | head -1)
          G=$(find build -maxdepth 2 -type f \( -name 'game_child' -o -name 'game_child.exe' \) | head -1)
          [ -n "$T" ] && [ -n "$G" ] || { echo "IDE IPC binaries not built"; exit 1; }
          "$T" "$G" | tee ide_play.txt
          grep -q "ide-play-spawn: PASS" ide_play.txt

      # Единственное платформенное исключение среди гейтов IDE, и оно постоянное: вторая половина
      # замера — unix-socket, а вывод замера уже принят (ADR 0007, shmem ~17×). Сам транспорт
      # закрыт швом platform_shmem и проверяется на трёх ОС шагом выше.
      - name: IDE — IPC transport bench shmem vs socket (gate 8, POSIX by design)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          B=$(find build -maxdepth 2 -type f -name 'ide_ipc_bench' | head -1)
          [ -n "$B" ] || { echo "ide_ipc_bench not built"; exit 1; }
          "$B" | tee ide_bench.txt
          grep -q "ide-ipc-bench: PASS" ide_bench.txt

      - name: IDE — IPC ASan/UBSan (shmem/seqlock/spawn, Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Шов shmem приезжает исходником (platform_shmem_posix.cpp), а не библиотекой: цель
          # санитайзерной сборки — инструментировать И шов тоже, а libplatform_core.a собран без -fsanitize.
          SAN="-fsanitize=address,undefined -fno-omit-frame-pointer -g -O1 -std=gnu++20 -Itools/ide -Iengine/platform"
          c++ $SAN tools/ide/ipc_selftest.cpp -pthread -o ide_seq_san   # чистый seqlock, без шва
          ./ide_seq_san | tee ide_seq_san.txt
          grep -q "ipc-seqlock: PASS" ide_seq_san.txt
          SEAM="engine/platform/platform_shmem_posix.cpp"
          c++ $SAN tools/ide/game_child.cpp $SEAM \
            engine/platform/platform_args.cpp engine/platform/platform_args_posix.cpp -pthread -lrt -o ide_gc_san
          c++ $SAN tools/ide/play_spawn_test.cpp $SEAM \
            engine/platform/platform_process_posix.cpp \
            engine/platform/platform_args.cpp engine/platform/platform_args_posix.cpp \
            -pthread -lrt -o ide_play_san
          # crash-изоляция: child намеренно null-deref'ит. handle_segv=0 несущий: с включённым
          # обработчиком ASan печатает отчёт и завершает процесс ШТАТНЫМ exit(1), а шов честно
          # читает это как ExitKind::Exited — гейт 4 краснеет на артефакте инструментации.
          # Инструмент. проверки ASan (redzone/UAF) сохраняются — снимается только обработчик SEGV.
          ASAN_OPTIONS=handle_segv=0:abort_on_error=0 ./ide_play_san ./ide_gc_san | tee ide_play_san.txt
          grep -q "ide-play-spawn: PASS" ide_play_san.txt

      # --- IDE-вертикаль срез 3 (спека #7, гейт 5) — build-loop. POSIX (fork/exec компилятора +
      # dlopen hot-reload #1). Диагностик-парсер (click-to-open) — детерм. unit (cross-OS формат).
      # build-loop гоняет реальный компилятор (build-часть гейта); live-панель — owner follow-up.
      - name: IDE — diagnostics parser (gate 5 click-to-open, all OS)
        shell: bash
        run: |
          BIN=$(find build -maxdepth 2 -type f \( -name 'diagnostics_test' -o -name 'diagnostics_test.exe' \) | head -1)
          [ -n "$BIN" ] || { echo "diagnostics_test not built"; exit 1; }
          "$BIN" | tee ide_diag.txt
          grep -q "ide-diagnostics: PASS" ide_diag.txt

      # Гейт 5 спеки #7 на трёх ОС (спека #13): watch через platform_watch, загрузка через
      # platform_module, командная строка компилятора — шаблоном из CMake. На Windows это ещё и
      # ЖИВОЙ прогон MSVC-диагностик (решение 3): панель ошибок наполняет настоящий cl.exe, а не
      # фикстура парсера.
      - name: IDE — build-loop watch->build->hot-reload module (gate 5, all OS)
        shell: bash
        run: |
          BIN=$(find build -maxdepth 2 -type f \( -name 'build_loop_test' -o -name 'build_loop_test.exe' \) | head -1)
          [ -n "$BIN" ] || { echo "build_loop_test not built"; exit 1; }
          "$BIN" | tee ide_bl.txt
          grep -q "ide-build-loop: PASS" ide_bl.txt

      - name: IDE — build-loop ASan/UBSan (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          SAN="-fsanitize=address,undefined -fno-omit-frame-pointer -g -O1 -std=gnu++20 -Itools/ide -Iengine/platform"
          # Парсеров два (gnu и msvc, решение 3 спеки #13), диспетчер зовёт оба — без их TU
          # санитайзерная сборка не слинкуется.
          c++ $SAN tools/ide/compile/diagnostics_test.cpp tools/ide/compile/diagnostics.cpp \
            tools/ide/compile/diagnostics_gnu.cpp tools/ide/compile/diagnostics_msvc.cpp -o ide_diag_san
          ./ide_diag_san | tee ide_diag_san.txt
          grep -q "ide-diagnostics: PASS" ide_diag_san.txt
          # Санитайзерная сборка собирается из TU напрямую, поэтому шаблон командной строки и
          # суффикс модуля задаются здесь так же, как их задаёт CMake обычной цели.
          BL="-DIDE_BUILD_ARGV='\"c++|-shared|-fPIC|-O2|{src}|-o|{out}\"' -DIDE_EXPORT='\"\"' -DIDE_MODULE_SUFFIX='\".so\"'"
          # Тест ходит в ФС и грузит модуль через швы platform_fs/platform_module/platform_watch —
          # их TU сюда же; диспетчер диагностик разбирает вывод компилятора.
          eval c++ $SAN $BL tools/ide/build_loop_test.cpp tools/ide/compile/diagnostics.cpp \
            tools/ide/compile/diagnostics_gnu.cpp tools/ide/compile/diagnostics_msvc.cpp \
            tools/ide/compile/build_orchestrator.cpp engine/platform/platform_fs.cpp \
            engine/platform/platform_fs_posix.cpp engine/platform/platform_path_posix.cpp \
            engine/platform/platform_env_posix.cpp engine/platform/platform_process_posix.cpp \
            engine/platform/platform_module_posix.cpp engine/platform/platform_watch_linux.cpp \
            engine/platform/platform_watch_poll.cpp \
            -ldl -lpthread -o ide_bl_san
          ./ide_bl_san | tee ide_bl_san.txt
          grep -q "ide-build-loop: PASS" ide_bl_san.txt

      # --- IDE-вертикаль срез 4 (спека #7, гейт 7) — перф 10k. Выделение/property-grid/undo/
      # виртуализация ≤ бюджет + zero per-frame heap (override operator new считает аллокации) +
      # масштаб-инвариантность (10k vs 50k → O(1)/O(видимого), не O(N)). Гоняется на всех 3 ОС.
      - name: IDE — perf 10k (selection/property-grid/undo/virtualization <= budget, all OS)
        shell: bash
        run: |
          BIN=$(find build -maxdepth 2 -type f \( -name 'perf_test' -o -name 'perf_test.exe' \) | head -1)
          [ -n "$BIN" ] || { echo "perf_test not built"; exit 1; }
          "$BIN" | tee ide_perf.txt
          grep -q "ide-perf: PASS" ide_perf.txt

      - name: IDE — perf ASan/UBSan (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          FLECSLIB=$(find build -type f -name 'libflecs_static.a' | head -1)
          FLECSINC=$(find build -path '*flecs-src/include' -type d | head -1)
          # -Iengine/platform: perf_test берёт оттуда PLATFORM_NOINLINE (см. audio-шаг выше).
          SAN="-fsanitize=address,undefined -fno-omit-frame-pointer -g -O1 -std=gnu++20 -Dflecs_STATIC -Itools/ide -Iengine/core -Iengine/platform -I$FLECSINC"
          c++ $SAN tools/ide/perf_test.cpp tools/ide/scene.cpp tools/ide/serialize.cpp "$FLECSLIB" -pthread -o ide_perf_san
          ./ide_perf_san | tee ide_perf_san.txt
          grep -q "ide-perf: PASS" ide_perf_san.txt

      # --- IDE-вертикаль срез 5 (спека #7, гейт 6) — live UI data-путь. property-grid из flecs meta
      # (генерик, любой компонент) + гизмо/камера transform — headless-гейт (data, что кормит UI).
      # Live-окно (вьюпорт+инспектор+гизмо, editor_shell) — owner-HW (imgui/GL, PLUGIN_UI on), как
      # plugin UI-shell / input_demo. Здесь CI валидирует data-путь + сборку.
      - name: IDE — editor data-path (property-grid from meta + gizmo/camera, all OS)
        shell: bash
        run: |
          BIN=$(find build -maxdepth 2 -type f \( -name 'editor_selftest' -o -name 'editor_selftest.exe' \) | head -1)
          [ -n "$BIN" ] || { echo "editor_selftest not built"; exit 1; }
          "$BIN" | tee ide_editor.txt
          grep -q "ide-editor-data: PASS" ide_editor.txt

      - name: IDE — editor data-path ASan/UBSan (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          FLECSLIB=$(find build -type f -name 'libflecs_static.a' | head -1)
          FLECSINC=$(find build -path '*flecs-src/include' -type d | head -1)
          SAN="-fsanitize=address,undefined -fno-omit-frame-pointer -g -O1 -std=gnu++20 -Dflecs_STATIC -Itools/ide -Iengine/core -I$FLECSINC"
          c++ $SAN tools/ide/editor/editor_selftest.cpp tools/ide/editor/property_grid.cpp tools/ide/scene.cpp tools/ide/serialize.cpp "$FLECSLIB" -pthread -o ide_editor_san
          ./ide_editor_san | tee ide_editor_san.txt
          grep -q "ide-editor-data: PASS" ide_editor_san.txt

      # --- Игра-вертикаль (спека #8, S7) — бой в детерм. sim. Sim-hash боя (fix32/целочисл. →
      # cross-arch golden, сверяется на всех 3 ОС, как input/plugin/ide) + run-to-run. Headless
      # (без рендера). Живой бой/HUD — owner-HW (окно), как game demo.
      - name: Game — combat sim-hash golden (S7, cross-arch) + run-to-run determinism
        shell: bash
        run: |
          BIN=$(find build -maxdepth 2 -type f \( -name 'game_sim_test' -o -name 'game_sim_test.exe' \) | head -1)
          [ -n "$BIN" ] || { echo "game_sim_test not built"; exit 1; }
          "$BIN" | tee game_sim.txt
          grep -q "0x32a094e89eacf2f2" game_sim.txt || { echo "COMBAT GOLDEN MISMATCH on ${{ matrix.os }}"; exit 1; }
          grep -q "game-sim: PASS" game_sim.txt

      # Гейт 6 спеки #12 — машинный суррогат «играбельности»: у раннеров нет ни окна, ни геймпада,
      # поэтому гоняем headless --demo. Он поднимает НАСТОЯЩИЙ тракт игры: адаптер WebGPU (Metal /
      # lavapipe / DX12-WARP) → baked-атлас из game.bundle → sim+ввод скриптованным драйвером →
      # спрайт-батч → bloom → readback → PNG. На Windows это ещё и доказательство, что asset_core
      # (mmap-бандл) и путь ассетов работают в игре, а не только в тестах. Кадры проверяются на
      # непустоту (пустой PNG сжимается в сотни байт) и на ИЗМЕНЕНИЕ во времени — статичный clear
      # прошёл бы первую проверку, но не вторую. Чего суррогат НЕ проверяет — ощущение от игры на
      # живом окне; сенсорное подтверждение остаётся follow-up'ом на железе владельца.
      - name: Game — headless demo renders animated frames (gate #6 surrogate)
        shell: bash
        run: |
          BIN=$(find build -maxdepth 2 -type f \( -name 'game_sidescroller' -o -name 'game_sidescroller.exe' \) | head -1)
          [ -n "$BIN" ] || { echo "game_sidescroller not built"; exit 1; }
          # Linux-раннер без GPU и без дисплея: адаптер даёт lavapipe (VK_ICD_FILENAMES выставлен
          # шагом «Vulkan ICD» и уже проверен на видимость), дисплей — xvfb. macOS/Windows берут
          # системный бэкенд (Metal / DX12-WARP) и обёрток не требуют.
          RUN=""
          if [ "$RUNNER_OS" = "Linux" ]; then
            RUN="xvfb-run -a"
          fi
          rm -rf demo_frames && mkdir -p demo_frames
          FRAMES=120
          $RUN "$BIN" --demo demo_frames --frames "$FRAMES" | tee demo.txt
          grep -q "demo wrote $FRAMES frames" demo.txt
          N=$(find demo_frames -type f -name 'frame_*.png' | wc -l)
          [ "$N" -eq "$FRAMES" ] || { echo "expected $FRAMES frames, got $N"; exit 1; }
          LAST=$(printf 'demo_frames/frame_%04d.png' $((FRAMES - 1)))
          SZ=$(wc -c < "$LAST")
          [ "$SZ" -gt 5000 ] || { echo "last frame looks blank ($SZ bytes)"; exit 1; }
          cmp -s demo_frames/frame_0000.png "$LAST" \
            && { echo "frames identical — game not animating"; exit 1; }
          echo "game demo: PASS ($N frames, last $SZ bytes, picture changes)"

      # --- Достижения (спека #10): ядро — чистый наблюдатель sim. Гейты 1/2 (golden+идемпотентность)
      # и 4-манифест, и бандл/плагин/Steam/крэш гоняются на всех 3 ОС: mmap, загрузка модуля и
      # «породить ребёнка и убить его» ушли за швы platform_io/platform_module/platform_process.
      - name: "Achievements — unlock-logic golden + idempotency (gates #1/#2, all OS)"
        shell: bash
        run: |
          need() { [ -n "$1" ] || { echo "$2 not built on ${{ matrix.os }}"; exit 1; }; }
          AT=$(find build -maxdepth 2 -type f \( -name 'achievements_test' -o -name 'achievements_test.exe' \) | head -1)
          need "$AT" achievements_test
          "$AT" | tee ach.txt
          grep -q "0xe728fef199e87fc9" ach.txt || { echo "ACH GOLDEN MISMATCH on ${{ matrix.os }}"; exit 1; }
          grep -q "PASS" ach.txt
          MT=$(find build -maxdepth 2 -type f \( -name 'ach_manifest_test' -o -name 'ach_manifest_test.exe' \) | head -1)
          need "$MT" ach_manifest_test
          "$MT" | tee achm.txt
          grep -q "PASS" achm.txt
          DT=$(find build -maxdepth 2 -type f \( -name 'ach_delivery_test' -o -name 'ach_delivery_test.exe' \) | head -1)
          need "$DT" ach_delivery_test
          "$DT" | tee achd.txt
          grep -q "PASS" achd.txt
          LT=$(find build -maxdepth 2 -type f \( -name 'ach_delivery_lifecycle_test' -o -name 'ach_delivery_lifecycle_test.exe' \) | head -1)
          need "$LT" ach_delivery_lifecycle_test
          "$LT" | tee achl.txt
          grep -q "PASS" achl.txt

      # kill-during-write перестал быть POSIX-only (спека #12): fork заменён на шов platform::Child
      # (перезапуск собственного exe + SIGKILL/TerminateProcess), поэтому половину транзакции
      # обрывает и Windows-раннер, а не только POSIX.
      - name: "Achievements — persistence + crash-during-write (gate #3, all OS)"
        shell: bash
        run: |
          need() { [ -n "$1" ] || { echo "$2 not built on ${{ matrix.os }}"; exit 1; }; }
          ST=$(find build -maxdepth 2 -type f \( -name 'ach_state_test' -o -name 'ach_state_test.exe' \) | head -1)
          need "$ST" ach_state_test
          "$ST" | tee achs.txt && grep -q "PASS" achs.txt
          CT=$(find build -maxdepth 2 -type f \( -name 'ach_crash_test' -o -name 'ach_crash_test.exe' \) | head -1)
          need "$CT" ach_crash_test
          "$CT" | tee achc.txt && grep -q "PASS" achc.txt

      - name: "Achievements — assetc bake -> bundle -> runtime (gate #4, all OS)"
        shell: bash
        run: |
          need() { [ -n "$1" ] || { echo "$2 not built on ${{ matrix.os }}"; exit 1; }; }
          BT=$(find build -maxdepth 2 -type f \( -name 'ach_bundle_test' -o -name 'ach_bundle_test.exe' \) | head -1)
          need "$BT" ach_bundle_test
          "$BT" | tee achb.txt && grep -q "PASS" achb.txt
          "$BT" example_ugly_game/assets/game.bundle | tee achb2.txt
          grep -q "PASS" achb2.txt

      - name: "Achievements — plugin seam + offline queue + Steam adapter (gates #5/#6, all OS)"
        shell: bash
        run: |
          need() { [ -n "$1" ] || { echo "$2 not built on ${{ matrix.os }}"; exit 1; }; }
          mod() { find build -maxdepth 2 -type f \( -name "$1.so" -o -name "$1.dylib" -o -name "$1.dll" \) | head -1; }
          PT=$(find build -maxdepth 2 -type f \( -name 'ach_plugin_test' -o -name 'ach_plugin_test.exe' \) | head -1)
          F=$(mod plugin_ach_fake)
          V=$(mod plugin_ach_v1)
          need "$PT" ach_plugin_test; need "$F" plugin_ach_fake; need "$V" plugin_ach_v1
          "$PT" "$F" "$V" | tee achp.txt && grep -q "PASS" achp.txt
          # Ручки ach_fake читаются на загрузке плагина → одна неисправность на прогон.
          for KNOB in ACH_FAKE_OFFLINE=2 ACH_FAKE_RETRY=2 ACH_FAKE_FATAL=1 ACH_FAKE_REMOTE=BOSS_DOWN \
                      ACH_FAKE_REMOTE_LATE=BOSS_DOWN; do
            env "$KNOB" "$PT" "$F" | tee achp_knob.txt
            grep -q "PASS" achp_knob.txt
          done
          XT=$(find build -maxdepth 2 -type f \( -name 'ach_steam_test' -o -name 'ach_steam_test.exe' \) | head -1)
          S=$(mod plugin_steam)
          need "$XT" ach_steam_test; need "$S" plugin_steam
          "$XT" "$S" | tee achx.txt && grep -q "PASS" achx.txt
          STEAM_STUB_REMOTE=BOSS_DOWN "$XT" "$S" | tee achx_remote.txt && grep -q "PASS" achx_remote.txt
          STEAM_STUB_INIT_FAIL=1 "$XT" "$S" | tee achx_init.txt && grep -q "PASS" achx_init.txt
          STEAM_STUB_STORE_FAIL=1 "$XT" "$S" | tee achx_store.txt && grep -q "PASS" achx_store.txt

      - name: "Achievements — sim-hash regression: observer must not touch sim (gate #7, all OS)"
        shell: bash
        run: |
          need() { [ -n "$1" ] || { echo "$2 not built on ${{ matrix.os }}"; exit 1; }; }
          mod() { find build -maxdepth 2 -type f \( -name "$1.so" -o -name "$1.dylib" -o -name "$1.dll" \) | head -1; }
          GT=$(find build -maxdepth 2 -type f \( -name 'ach_sim_test' -o -name 'ach_sim_test.exe' \) | head -1)
          F=$(mod plugin_ach_fake)
          need "$GT" ach_sim_test; need "$F" plugin_ach_fake
          "$GT" example_ugly_game/assets/game.bundle "$F" | tee achg.txt
          grep -q "0x32a094e89eacf2f2 (bare) 0x32a094e89eacf2f2 (observer) 0x32a094e89eacf2f2 (plugin)" achg.txt \
            || { echo "ACH OBSERVER CHANGED SIM HASH on ${{ matrix.os }}"; exit 1; }
          grep -q "game-achievements: PASS" achg.txt

      # --- Фреймворк (спека #14): гейты 1-7. Тесты чистые (без GPU и окна), поэтому гоняются на
      # всех трёх ОС: раскладка zero-parse таблицы, целочисленная форма стика и ноль аллокаций в
      # тике — ровно те инварианты, которые ломаются молча при смене компилятора и разрядности.
      - name: "Framework — schedule/stick/presets/pads/rebinds + zero-alloc tick (gates 1-7, all OS)"
        shell: bash
        run: |
          need() { [ -n "$1" ] || { echo "$2 not built on ${{ matrix.os }}"; exit 1; }; }
          # framework_trig_test здесь, а не в физическом шаге: таблица синуса живёт в
          # framework/core и не знает о телах. Но гоняется она на трёх ОС по той же причине, что и
          # хеш физики, — это ЦЕЛОЧИСЛЕННАЯ замена libm, и вся её ценность в том, что x86 и ARM
          # дают один бит. Разойдись она — физический голден покажет расхождение, но не назовёт
          # причину.
          for T in framework_schedule_test framework_stick_test framework_preset_test \
                   framework_preset_refusal_test framework_pad_test framework_rebind_test \
                   framework_golden_test framework_trig_test framework_rt_test; do
            B=$(find build -maxdepth 2 -type f \( -name "$T" -o -name "$T.exe" \) | head -1)
            need "$B" "$T"
            "$B" | tee "fw_$T.txt"
            grep -q ": PASS" "fw_$T.txt" || { echo "$T FAILED on ${{ matrix.os }}"; exit 1; }
          done
          # Гейт 1: эталон разрешения ввода через пресет. Хеш целочисленный, поэтому обязан
          # совпасть на трёх ОС — расхождение здесь и есть та регрессия, ради которой гейт заведён.
          grep -q "preset-input-hash = 0x416969081dcf230d" fw_framework_golden_test.txt \
            || { echo "PRESET INPUT GOLDEN MISMATCH on ${{ matrix.os }}"; exit 1; }

      # Инвариант 1 спеки #14: слой знает о подсистемах, подсистемы о слое — нет. Проверяется
      # грепом, а не сборкой: обратное включение компилируется прекрасно и всплыло бы только
      # циклом в CMake через полгода. Сначала доказываем, что поиск вообще ищет, — иначе опечатка
      # в пути дала бы вечно зелёный гейт.
      - name: "Framework — subsystems do not depend on the layer (invariant 1, Linux)"
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/tree_invariants.sh deps

      # --- Физика (спека #15), вертикаль 1: гейты 1, 2 и 6. Тесты чистые — ни GPU, ни окна, ни
      # железа, — поэтому гоняются на всех трёх ОС. Смысл именно в трёх: состояние считается на
      # fix32, и хеш обязан совпасть побайтно на x86 и на ARM. Разойдётся — это и есть та
      # регрессия, ради которой гейт заведён, а не «погрешность».
      - name: "Physics — state golden, order independence, range, stack, sleep, speculative band (gates 1/2/3/5/6, all OS)"
        shell: bash
        run: |
          need() { [ -n "$1" ] || { echo "$2 not built on ${{ matrix.os }}"; exit 1; }; }
          # Диапазонный гейт в том же списке и намеренно: golden закрепляет ОДНУ сцену из середины
          # диапазона и ровно поэтому пропустил насыщение импульса под тяжёлым телом. Границы
          # заявленных входов проверяются отдельно от удобной середины. По той же причине здесь и
          # полоса спекулятивного контакта: она — граница, а голден снят из середины.
          #
          # Стопка и сон — вертикаль 3, и на трёх ОС они нужны не меньше голдена. Стопка отвечает за
          # ОТСУТСТВИЕ дрейфа на длинном прогоне (накопление в fix32 разойтись между x86 и ARM не
          # имеет права), сон — за совпадение двух прогонов одной сцены; расхождение сна с явью один
          # раз уже было настоящим дефектом кеша, а не артефактом теста.
          #
          # Двери пробуждения — из того же ряда и на трёх ОС по той же причине: замирание решает
          # арифметика fix32, а закрытая дверь не даёт ни исключения, ни расхождения хеша — она даёт
          # ящик, висящий там, где из-под него убрали пол. Голдену такого не увидеть: он сверяет
          # прогон, в котором обстановку никто не менял.
          #
          # Глубина стека — на трёх ОС по третьей причине: её граница ножевая, и разъехавшись между
          # x86 и ARM на один ящик, она сделает заявленную в `solver.hpp` цифру верной ровно на
          # одной из них. Гейт стопки этого не видит: он прибит к шести ящикам, то есть к середине.
          for T in framework_physics_test framework_physics_point_test framework_physics_sat_test framework_physics_gap_test \
                   framework_physics_order_test framework_physics_range_test framework_physics_clamp_test \
                   framework_physics_terms_test framework_physics_rt_test framework_physics_query_test \
                   framework_physics_corner_test \
                   framework_tilemap_test framework_tilemap_seam_test framework_tilemap_slope_test \
                   framework_tilemap_oneway_test \
                   framework_physics_overlap_test framework_physics_index_test \
                   framework_physics_filter_test framework_physics_event_test \
                   framework_physics_stack_test framework_physics_impact_test framework_physics_sleep_test \
                   framework_physics_band_test framework_physics_wake_test framework_physics_handle_test \
                   framework_physics_depth_test framework_character_test framework_character_window_test \
                   framework_character_jump_test framework_character_tunnel_test \
                   framework_character_collision_test framework_character_corner_test \
                   framework_character_snap_test framework_character_slope_test \
                   framework_character_oneway_test framework_character_platform_test \
                   framework_character_alloc_test framework_character_profile_test \
                   framework_character_profile_refusal_test framework_character_bundle_test \
                   framework_tilemap_bake_test framework_tilemap_refusal_test \
                   framework_tilemap_bundle_test; do
            B=$(find build -maxdepth 2 -type f \( -name "$T" -o -name "$T.exe" \) | head -1)
            need "$B" "$T"
            "$B" | tee "phys_$T.txt"
            grep -q ": PASS" "phys_$T.txt" || { echo "$T FAILED on ${{ matrix.os }}"; exit 1; }
          done
          # Гейт 1 отдельной строкой, а не общим PASS: сам тест сверяет эталон изнутри, но в логе
          # CI обязано быть видно ЗНАЧЕНИЕ, иначе расследование расхождения начинается с пересборки.
          grep -q "physics-state-hash = 0xf238d0bc34325db6" phys_framework_physics_test.txt \
            || { echo "PHYSICS STATE GOLDEN MISMATCH on ${{ matrix.os }}"; exit 1; }
          # Гейт 1 спеки #16 той же строкой и по той же причине: траектория персонажа — второй
          # голден, идущий через три ОС, и его ЗНАЧЕНИЕ обязано быть в логе рядом с физическим.
          grep -q "character trajectory hash = 0x7801049c168bb301" phys_framework_character_test.txt \
            || { echo "CHARACTER TRAJECTORY GOLDEN MISMATCH on ${{ matrix.os }}"; exit 1; }
          # Третий голден этого шага — БАЙТЫ испечённого профиля движения. Он в логе по той же
          # причине, что два выше, и ловит своё: round-trip пережил бы согласованную перестановку
          # полей в пекаре и читателе, а `game.bundle` в git — нет.
          grep -q "hash 0x5633becd833be880" phys_framework_character_profile_test.txt \
            || { echo "MOVEMENT PROFILE TABLE GOLDEN MISMATCH on ${{ matrix.os }}"; exit 1; }
          # Четвёртый голден шага — свёртка ответов трёх запросов к тайловой сетке (гейт шага A
          # вертикали 2 спеки #16). В логе по той же причине: расхождение обязано называть себя
          # значением, а не «тест упал».
          grep -q "tilemap answers hash = 0xb19419157787b1c3" phys_framework_tilemap_test.txt \
            || { echo "TILEMAP ANSWERS GOLDEN MISMATCH on ${{ matrix.os }}"; exit 1; }
          # Пятый голден шага — БАЙТЫ испечённой таблицы карт (вертикаль 2 спеки #16). Он ловит то,
          # чего не видит НИ ОДНА из двух сверок бандла: согласованную перестановку полей в пекаре и
          # читателе. Проверено сломанной реализацией — swap width/height в обоих оставляет
          # `--verify-game` и `framework_tilemap_bundle_test` зелёными и меняет это число.
          grep -q "hash 0xcd034f07f57b5f8b" phys_framework_tilemap_bake_test.txt \
            || { echo "TILEMAP TABLE GOLDEN MISMATCH on ${{ matrix.os }}"; exit 1; }

      # Гейт 8 отдельным шагом, а не строкой в цикле выше, ровно потому, что он ОДИН здесь мерит
      # цену, а не правильность. Утверждает он счётчики работы — величины детерминированные и
      # одинаковые на трёх ОС до единицы; стенные часы он печатает и НЕ проверяет. Раннер GitHub
      # делится с соседями, и красный шаг «кадр занял 3.1 мс вместо 2» отключили бы первым же —
      # вместе со всем гейтом. Цифры кадра при этом в логе нужны: расхождение раскладки между ОС
      # начинается с вопроса «а сколько там было», и ответ на него обязан лежать в прогоне, а не
      # добываться пересборкой.
      - name: "Physics — work counters on the load scenes (gate 8, all OS)"
        shell: bash
        run: |
          need() { [ -n "$1" ] || { echo "$2 not built on ${{ matrix.os }}"; exit 1; }; }
          T=framework_physics_perf_test
          B=$(find build -maxdepth 2 -type f \( -name "$T" -o -name "$T.exe" \) | head -1)
          need "$B" "$T"
          # Литерала счётчиков здесь НЕТ намеренно: эталон живёт константами в самом бинаре
          # (`framework_physics_perf_test.cpp`), и расхождение между ОС валит его собственный PASS.
          # Греп по литералу в workflow не проверяется ничем локально и всплывал бы только после
          # пуша и двадцати минут прогона на трёх ОС — ровно та петля, ради которой заведён ci_lint.
          "$B" | tee phys_perf.txt
          grep -q ": PASS" phys_perf.txt || { echo "$T FAILED on ${{ matrix.os }}"; exit 1; }

      # Инвариант 1 спеки #15 требует совпадения в Debug И Release, а до сих пор всё дерево
      # собиралось только Release: голден на -O0 не сверял никто. Это не педантизм — в
      # целочисленной арифметике расхождение между уровнями оптимизации означает UB, то есть
      # право компилятора выкинуть проверку, а не «погрешность». Санитайзерный шаг ниже гоняет
      # -O1 и только на Linux; здесь -O0 на всех трёх ОС.
      #
      # Список целей ОБЯЗАН совпадать со `STATE_TARGETS` в `scripts/check_debug_golden.sh`: он собран руками в
      # двух местах, и разъехавшись, тихо оставляет цель без Debug-прогона на той стороне, где её
      # забыли. Гейт 8 (`framework_physics_perf_test`) в нём потому, что его эталон счётчиков — такой
      # же голден, только сверяет он ЧИСЛО работы, а не хеш состояния; на MSVC и gcc это
      # единственное место, где -O0 против -O3 по нему проверяется вообще. Этап от него дороже:
      # локально сцена кучи стоит 28 мс на кадр против 2.3 на -O3, то есть порядка полуминуты на
      # прогон, и на раннере — кратно больше.
      - name: "Physics — the golden holds in Debug too (invariant 1: Debug and Release, all OS)"
        shell: bash
        env:
          BUILD_DIR: build-debug
          LIKE_NES_BUILD_SUBSET: "1"
          LIKE_NES_BUILD_TYPE: Debug
          # ci-lint: mirrors-var scripts/check_debug_golden.sh STATE_TARGETS
          LIKE_NES_BUILD_TARGETS: "framework_physics_test framework_physics_point_test framework_physics_sat_test framework_physics_gap_test framework_physics_order_test framework_physics_range_test framework_physics_clamp_test framework_physics_terms_test framework_physics_rt_test framework_physics_perf_test framework_physics_query_test framework_physics_corner_test framework_tilemap_test framework_tilemap_seam_test framework_physics_overlap_test framework_physics_index_test framework_physics_filter_test framework_physics_event_test framework_physics_stack_test framework_physics_impact_test framework_physics_sleep_test framework_physics_band_test framework_physics_wake_test framework_physics_handle_test framework_physics_depth_test framework_trig_test framework_character_test framework_character_window_test framework_character_jump_test framework_character_tunnel_test framework_character_collision_test framework_character_corner_test framework_character_snap_test framework_character_profile_test framework_character_profile_refusal_test framework_tilemap_bake_test framework_tilemap_refusal_test framework_character_slope_test framework_character_oneway_test framework_character_platform_test framework_tilemap_slope_test framework_tilemap_oneway_test"
        run: |
          # Отдельный каталог, а не переконфигурация основного: тот собран Release и на нём стоят
          # все шаги выше. Целей ровно столько, сколько лежит на пути СОСТОЯНИЯ, — дерево Debug'ом
          # собирать незачем. Таблица синуса среди них потому, что вращение считается ею: её
          # собственное расхождение между уровнями оптимизации обязана назвать она, а не голден сцены.
          cmake -S . -B build-debug -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DAUDIO_MINIAUDIO=OFF -DPLUGIN_UI=OFF -DPLUGIN_WASM=OFF
          bash scripts/build_check.sh
          need() { [ -n "$1" ] || { echo "$2 not built on ${{ matrix.os }}"; exit 1; }; }
          for T in framework_physics_test framework_physics_point_test framework_physics_sat_test framework_physics_gap_test \
                   framework_physics_order_test framework_physics_range_test framework_physics_clamp_test \
                   framework_physics_terms_test framework_physics_rt_test framework_physics_perf_test framework_physics_query_test \
                   framework_physics_corner_test \
                   framework_tilemap_test framework_tilemap_seam_test \
                   framework_physics_overlap_test framework_physics_index_test \
                   framework_physics_filter_test framework_physics_event_test \
                   framework_physics_stack_test framework_physics_impact_test framework_physics_sleep_test \
                   framework_physics_band_test framework_physics_wake_test framework_physics_handle_test \
                   framework_physics_depth_test framework_trig_test framework_character_test \
                   framework_character_window_test framework_character_jump_test \
                   framework_character_tunnel_test framework_character_collision_test \
                   framework_character_corner_test framework_character_snap_test \
                   framework_character_profile_test framework_character_profile_refusal_test \
                   framework_tilemap_bake_test framework_tilemap_refusal_test \
                   framework_character_slope_test framework_character_oneway_test framework_character_platform_test \
                   framework_tilemap_slope_test framework_tilemap_oneway_test; do
            B=$(find build-debug -maxdepth 2 -type f \( -name "$T" -o -name "$T.exe" \) | head -1)
            need "$B" "$T"
            "$B" | tee "dbg_$T.txt"
            grep -q ": PASS" "dbg_$T.txt" || { echo "$T FAILED in Debug on ${{ matrix.os }}"; exit 1; }
          done
          # Тот же литерал, что у Release-шага выше, и это весь смысл шага: сверять Debug-прогон с
          # самим собой значило бы проверять, что -O0 воспроизводим, а не что он согласен с -O3.
          grep -q "physics-state-hash = 0xf238d0bc34325db6" dbg_framework_physics_test.txt \
            || { echo "PHYSICS DEBUG/RELEASE GOLDEN MISMATCH on ${{ matrix.os }}"; exit 1; }
          # Траектория персонажа обязана совпасть между -O0 и -O3 по тому же основанию: расхождение
          # уровней оптимизации в целочисленной арифметике это UB, а не погрешность.
          grep -q "character trajectory hash = 0x7801049c168bb301" dbg_framework_character_test.txt \
            || { echo "CHARACTER DEBUG/RELEASE GOLDEN MISMATCH on ${{ matrix.os }}"; exit 1; }
          # Таблица профиля собирается разбором числа из текста, то есть арифметикой по int64:
          # расхождение -O0 с -O3 здесь означало бы UB, а не погрешность, — как и у двух выше.
          grep -q "hash 0x5633becd833be880" dbg_framework_character_profile_test.txt \
            || { echo "PROFILE TABLE DEBUG/RELEASE GOLDEN MISMATCH on ${{ matrix.os }}"; exit 1; }
          # Ответы сетки складываются из долей и точек, то есть из той же арифметики fix32:
          # расхождение -O0 с -O3 здесь означало бы UB ровно по основанию трёх голденов выше.
          grep -q "tilemap answers hash = 0xb19419157787b1c3" dbg_framework_tilemap_test.txt \
            || { echo "TILEMAP DEBUG/RELEASE GOLDEN MISMATCH on ${{ matrix.os }}"; exit 1; }
          # Таблица карт собирается тем же разбором числа по int64, что и профиль выше: расхождение
          # -O0 с -O3 на ней означало бы UB, а не «другие байты».
          grep -q "hash 0xcd034f07f57b5f8b" dbg_framework_tilemap_bake_test.txt \
            || { echo "TILEMAP TABLE DEBUG/RELEASE GOLDEN MISMATCH on ${{ matrix.os }}"; exit 1; }

      - name: Physics — ASan/UBSan (fixed-point overflow, solver, order independence, Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Гейт 7 спеки #15. Основная сборка идёт с -O3, эта — с -O1: знаковое переполнение в
          # промежуточном произведении Q32.32 — UB, то есть право компилятора выкинуть проверку,
          # и на разных уровнях оптимизации оно проявляется по-разному. Один уровень доказывал бы
          # только про себя.
          SAN="-fsanitize=address,undefined -fno-omit-frame-pointer -g -O1 -std=gnu++20 -Iengine/core -Iengine/platform -Iengine/framework/core -Iengine/framework/physics"
          # Список единиц трансляции здесь свой, не CMake-овский, и однажды он уже отстал от
          # цели на один файл — линковка упала на раннере, когда всё локальное было зелёным.
          # ci-lint: mirrors-target engine/framework/physics/CMakeLists.txt framework_physics
          LIB="engine/framework/core/fixmath.cpp engine/framework/core/fixtrig.cpp engine/framework/physics/axis_terms.cpp engine/framework/physics/body.cpp engine/framework/physics/broadphase.cpp engine/framework/physics/cache.cpp engine/framework/physics/cast.cpp engine/framework/physics/distance.cpp engine/framework/physics/event_hash.cpp engine/framework/physics/events.cpp engine/framework/physics/gap.cpp engine/framework/physics/island.cpp engine/framework/physics/mass.cpp engine/framework/physics/narrowphase.cpp engine/framework/physics/nearest.cpp engine/framework/physics/prepare.cpp engine/framework/physics/query.cpp engine/framework/physics/query_index.cpp engine/framework/physics/rest.cpp engine/framework/physics/sat.cpp engine/framework/physics/shape.cpp engine/framework/physics/solver.cpp engine/framework/physics/state_hash.cpp engine/framework/physics/world.cpp"
          PLAT="engine/platform/platform_args.cpp engine/platform/platform_args_posix.cpp"
          c++ $SAN $LIB engine/framework/physics/framework_physics_test.cpp $PLAT -o phys_san
          ./phys_san | tee physsan.txt
          # Тот же эталон, что и у -O3-сборки выше: санитайзерный прогон обязан не только молчать,
          # но и досчитать до того же состояния.
          grep -q "physics-state-hash = 0xf238d0bc34325db6" physsan.txt
          c++ $SAN $LIB engine/framework/physics/framework_physics_order_test.cpp $PLAT -o phys_order_san
          ./phys_order_san | tee physordersan.txt
          grep -q ": PASS" physordersan.txt
          # Границы диапазона — самое ценное для санитайзеров место во всём модуле: там, где
          # арифметика Q16.16 подходит к насыщению вплотную, знаковое переполнение промежуточного
          # произведения и есть тот UB, ради которого этот шаг существует.
          c++ $SAN $LIB engine/framework/physics/framework_physics_range_test.cpp $PLAT -o phys_range_san
          ./phys_range_san | tee physrangesan.txt
          grep -q ": PASS" physrangesan.txt
          # Клампы — вторая половина того же вопроса и с вертикали 2 более ценная, чем прогоны:
          # именно здесь вход подводится к самому потолку (вершина 30000 при MAX_SHAPE_HALF, угловая
          # скорость у предела, вектор из INT32_MAX в обеих координатах), то есть произведения
          # считаются там, где промежуточный Q32.32 ближе всего к переполнению.
          c++ $SAN $LIB engine/framework/physics/framework_physics_clamp_test.cpp $PLAT -o phys_clamp_san
          ./phys_clamp_san | tee physclampsan.txt
          grep -q ": PASS" physclampsan.txt
          # Гейт 6 (`framework_physics_rt_test`) здесь потому, что его ручная разметка выравненного
          # выделения проверяема ТОЛЬКО санитайзером: `delete` от указателя, которого `malloc` не
          # выдавал, портит кучу молча, и без ASan цель печатала бы PASS ровно так же. Обещание
          # такого покрытия в комментарии теста уже стояло, а самой сборки под санитайзером не было.
          # TU позитивного контроля дописан к этой цели поимённо: он живёт ОТДЕЛЬНЫМ файлом ровно
          # затем, чтобы компилятор не свернул выделение в `true` и не выбросил его вместе с парным
          # освобождением, — а ручная сборка про этот файл не знала и падала на линковке
          # (`undefined reference to framework::probe::control::plain_allocation`). Цель собирается
          # тут вручную, значит и список TU держится тут вручную: CMake для неё не спрашивают.
          c++ $SAN $LIB engine/framework/core/framework_alloc_probe_control.cpp \
            engine/framework/physics/framework_physics_rt_test.cpp $PLAT -o phys_rt_san
          ./phys_rt_san | tee physrtsan.txt
          grep -q ": PASS" physrtsan.txt
          # Узкая фаза: SAT и отсечение — единственное место модуля, где произведения идут по
          # ПОВЁРНУТЫМ координатам, то есть через таблицу синуса, а не по осям мира. Целей три, по
          # числу её путей: под санитайзером они выполняют РАЗНЫЙ код (расстояние до ядра, отсечение
          # граней, перебор вершин), и прогнать один из них значило бы оставить два без проверки.
          for T in point sat gap; do
            c++ $SAN $LIB "engine/framework/physics/framework_physics_${T}_test.cpp" $PLAT -o "phys_${T}_san"
            "./phys_${T}_san" | tee "phys${T}san.txt"
            grep -q ": PASS" "phys${T}san.txt"
          done
          # Коэффициенты оси считаются в Q16.32 — вдвое длиннее всего остального в модуле, и оба
          # произведения там подведены к границе int64 намеренно (запас вдвое, не на порядок).
          # `__int128` на MSVC нет, поэтому границу держит рассуждение в комментарии, а проверяет её
          # только этот шаг: знаковое переполнение int64 — то же UB, что и в Q32.32 выше.
          c++ $SAN $LIB engine/framework/physics/framework_physics_terms_test.cpp $PLAT -o phys_terms_san
          ./phys_terms_san | tee phystermssan.txt
          grep -q ": PASS" phystermssan.txt
          # Свип (гейт 4) — единственный ИТЕРАТИВНЫЙ код модуля: доля пути растёт делением на
          # сближение, и оба конца этого частного подведены к насыщению на касательном пути, где
          # сближение стремится к нулю. Санитайзеру тут есть что сказать, чего не скажет ни голден,
          # ни таблица эталонов: она проверяет ОТВЕТ, а не то, как считалось промежуточное.
          for T in query overlap filter event; do
            c++ $SAN $LIB "engine/framework/physics/framework_physics_${T}_test.cpp" $PLAT -o "phys_${T}_san"
            "./phys_${T}_san" | tee "phys${T}san.txt"
            grep -q ": PASS" "phys${T}san.txt"
          done
          # Вертикаль 3, и здесь у санитайзера свой вопрос, не совпадающий ни с одним выше. Признак
          # «запись сделана замершей парой» лежит в кеше ПАРАЛЛЕЛЬНЫМ массивом, а индекс в него даёт
          # двоичный поиск: рассинхрон двух массивов — это чтение за границей, которого не увидит ни
          # один голден, потому что прочитанный мусор — валидный `uint8_t`. Стопка добавляет к этому
          # длину прогона (600 шагов против десятков), сон — второй мир в той же памяти. Двери
          # пробуждения добавляют своё: они ходят по телам ПО ИНДЕКСУ ОСТРОВА, а не по парам, и
          # индекс этот приходит из другого массива — ровно та раскладка, где выход за границу
          # молчит, пока рядом лежит валидная память.
          # Индекс запросов (раунд `perf(physics)`) ложится сюда по тому же основанию: полоса
          # кандидатов ищется двумя двоичными поисками по ТРЁМ параллельным массивам, и слот,
          # уехавший за конец полосы, читается как валидный `uint32_t`, которым тут же индексируют
          # второй массив. Голден на это молчит по устройству запроса: лишний кандидат отсеивается
          # проверкой пересечения, то есть на ОТВЕТЕ не виден вовсе.
          for T in stack sleep band wake index; do
            c++ $SAN $LIB "engine/framework/physics/framework_physics_${T}_test.cpp" $PLAT -o "phys_${T}_san"
            "./phys_${T}_san" | tee "phys${T}san.txt"
            grep -q ": PASS" "phys${T}san.txt"
          done
          # Вертикаль 2, шаг A. Вопрос у санитайзера здесь опять свой: сетка ПЛОСКАЯ, тайл берётся
          # по `y * width + x` из одного вектора, а окно зонда считается делением координат на
          # размер тайла и отсекается по карте. Промах отсечения на единицу читает соседний
          # `TileFlags` — валидный `uint16_t`, — и голден на это молчит по устройству ответа: лишний
          # тайл либо пуст, либо отсеивается геометрией, то есть на ответе не виден. Сцены гейта
          # стыка ходят вдоль самых границ карты (490 выровненных свипов и 256 путей сквозь плиту),
          # то есть ровно там, где такой промах и живёт.
          # ci-lint: mirrors-target engine/framework/tilemap/CMakeLists.txt framework_tilemap
          TILES="engine/framework/tilemap/grid.cpp engine/framework/tilemap/query.cpp engine/framework/tilemap/map_text.cpp engine/framework/tilemap/map_parse.cpp engine/framework/tilemap/map_bake.cpp engine/framework/tilemap/map_read.cpp"
          # Пекарь читает исходник файлом, поэтому шов файловой системы линкуется здесь же: CMake в
          # этом шаге не участвует, и цепочка собирается поимённо.
          # ci-lint: mirrors-group seam-fs
          TILES_FS="engine/platform/platform_fs.cpp engine/platform/platform_fs_posix.cpp engine/platform/platform_path_posix.cpp engine/platform/platform_env_posix.cpp"
          c++ $SAN -Iengine/framework/tilemap $LIB $TILES $TILES_FS \
            engine/framework/tilemap/framework_tilemap_test.cpp $PLAT -o tiles_san
          ./tiles_san | tee tilessan.txt
          grep -q "tilemap answers hash = 0xb19419157787b1c3" tilessan.txt
          c++ $SAN -Iengine/framework/tilemap $LIB $TILES $TILES_FS \
            engine/framework/tilemap/framework_tilemap_seam_test.cpp $PLAT -o tiles_seam_san
          ./tiles_seam_san | tee tilesseamsan.txt
          grep -q ": PASS" tilesseamsan.txt
          # Склон ложится сюда по СВОЕМУ основанию: ориентация тайла — это ИНДЕКС в массив из
          # четырёх кешированных форм, собранный из битов флагов. Промах индекса читает валидную
          # `physics::Shape` (соседнюю ориентацию или мусор рядом), то есть даёт не падение, а
          # другой ответ — и различить «не тот индекс» и «не та геометрия» может только санитайзер.
          c++ $SAN -Iengine/framework/tilemap $LIB $TILES $TILES_FS \
            engine/framework/tilemap/framework_tilemap_slope_test.cpp $PLAT -o tiles_slope_san
          ./tiles_slope_san | tee tilesslopesan.txt
          grep -q ": PASS" tilesslopesan.txt
          # Пекарь и читатель таблицы ложатся сюда по СВОЕМУ основанию: обе стороны считают
          # смещения в плоский байтовый блок, и промах на запись читается как валидный `uint32_t` —
          # соседнее поле, а не сегфолт. Голден на такое молчит, пока промах остаётся внутри своих
          # же байт, и увидеть его может только санитайзер.
          # Односторонний тайл — своё основание: правило прихода сверху берёт САМУЮ НИЖНЮЮ точку
          # движущейся формы, то есть проходит буфер вершин по счётчику, и сверяет её с границами
          # тайла, взятыми из того же плоского вектора, что и флаги. Промах по любому из двух даёт
          # валидный `fix32` — то есть другой ответ «держит/пропускает», а не падение, — и голден
          # ответов сетки на это молчит: одностороннего тайла в его сцене нет вовсе.
          c++ $SAN -Iengine/framework/tilemap $LIB $TILES $TILES_FS \
            engine/framework/tilemap/framework_tilemap_oneway_test.cpp $PLAT -o tiles_oneway_san
          ./tiles_oneway_san | tee tilesonewaysan.txt
          grep -q ": PASS" tilesonewaysan.txt
          c++ $SAN -Iengine/framework/tilemap $LIB $TILES $TILES_FS \
            engine/framework/tilemap/framework_tilemap_bake_test.cpp $PLAT -o tiles_bake_san
          ./tiles_bake_san | tee tilesbakesan.txt
          grep -q "hash 0xcd034f07f57b5f8b" tilesbakesan.txt
          # Отказы — вторая половина того же вопроса: испорченная таблица разбирается ЧИТАТЕЛЕМ, то
          # есть чтение идёт по заведомо неверным смещениям. Без санитайзера «отбито проверкой» и
          # «прочитано мимо, но повезло» дают одинаково зелёный прогон.
          c++ $SAN -Iengine/framework/tilemap $LIB $TILES $TILES_FS \
            engine/framework/tilemap/framework_tilemap_refusal_test.cpp $PLAT -o tiles_refusal_san
          ./tiles_refusal_san | tee tilesrefusalsan.txt
          grep -q ": PASS" tilesrefusalsan.txt
          # Гейт 1 спеки #16 под тем же санитайзером и по тому же основанию, что и голден физики:
          # путь состояния персонажа считает `profile.cpp` СЫРЫМИ int64 (`2 * g.raw * h.raw` под
          # целочисленным корнем), то есть ровно там, где знаковое переполнение — UB, а не большое
          # число. Голден на -O3 такое пропускает молча: компилятор вправе выкинуть проверку, и
          # хеш при этом остаётся стабильным на всех трёх ОС. Сверяется ЗНАЧЕНИЕ, а не PASS, —
          # санитайзерный прогон обязан досчитать до того же эталона.
          #
          # Стоит ПОСЛЕ тайлмапа не по вкусу: с вертикали 3 сцена голдена выложена тайлами, и
          # линкуется он теперь через `$TILES` — то есть через список, у которого уже есть эталон
          # (`mirrors-target` выше). Своя копия имён тайлмапа рядом с `CHAR` завела бы второй
          # руками написанный список без эталона, а именно этот класс и стоил красной сборки 23-го.
          # Сам `CHAR` перечисляет шесть файлов модуля из десяти ОСОЗНАННО: путь голдена — это
          # контроллер, профиль, скольжение, шов сцены, геометрическое прощение и хеш; пекарь,
          # парсер и читатель профиля в прогоне не участвуют вовсе, и равенство с целью отбивало бы
          # список ложно. `assist.cpp` приехал в него с вертикалью 3 не потому, что прогон зовёт эти
          # приёмы (в сцене голдена не срабатывает ни один), а потому что их зовёт `controller.cpp`:
          # линкеру безразлично, исполнится вызов или нет.
          # `$TILES_FS` едет вместе с `$TILES` и без него не обходится: список зеркалит ЦЕЛЬ, а в
          # цели лежит пекарь карт, читающий исходник файлом. Прогон персонажа пекаря не зовёт
          # вовсе, но линкеру это безразлично — `undefined reference to platform::read_text` стоил
          # красной сборки на единственном раннере, где шаг вообще запускается.
          CHAR="engine/framework/character/controller.cpp engine/framework/character/collision.cpp engine/framework/character/profile.cpp engine/framework/character/slide.cpp engine/framework/character/assist.cpp engine/framework/character/support.cpp engine/framework/character/trajectory.cpp"
          c++ $SAN -Iengine/framework/character -Iengine/framework/tilemap $LIB $TILES $TILES_FS $CHAR \
            engine/framework/character/framework_character_test.cpp $PLAT -o char_san
          ./char_san | tee charsan.txt
          grep -q "character trajectory hash = 0x7801049c168bb301" charsan.txt
          # Шов смешанной сцены — свой вопрос к санитайзеру, не совпадающий ни с голденом, ни с
          # гейтами тайлмапа: слияние читает ответ ОДНОГО источника и переписывает им ответ другого,
          # то есть работает с полем структуры, заполненной не тем вызовом, который её объявил.
          c++ $SAN -Iengine/framework/character -Iengine/framework/tilemap $LIB $TILES $TILES_FS $CHAR \
            engine/framework/character/framework_character_collision_test.cpp $PLAT -o char_scene_san
          ./char_scene_san | tee charscenesan.txt
          grep -q ": PASS" charscenesan.txt
          # Геометрическое прощение и склоны — третий вопрос к санитайзеру, и целей у него три:
          # сдвиг из-под угла, притяжение к полу и ходьба по склону гоняют свип каждая по СВОЕЙ
          # сцене и по позиции, которую в тот момент никто не двигал, — а сцена голдена не
          # срабатывает ни на одной из них, то есть под ASan этот путь иначе не попадает вовсе.
          # Склон добавляет к этому ЕДИНСТВЕННОЕ место, где свип отвечает диагональной гранью
          # тайла: развёртка треугольника живёт в буфере вершин, и промах по нему осевые сцены не
          # видят. Цели зовутся одним циклом: разойтись флагами им негде, а скопированные вызовы
          # расходятся ровно так, как расходятся списки, — молча.
          # Односторонняя платформа приезжает в тот же цикл четвёртой целью: спуск копирует сцену
          # на тик и дописывает биту исключения, а зонд опоры лезет за флагом тайла ПО ИНДЕКСУ
          # хита — по тому самому плоскому вектору, промах по которому даёт валидный `TileFlags`.
          # Движущаяся платформа — пятой целью, и вопрос у неё к санитайзеру свой: это ЕДИНСТВЕННЫЙ
          # прогон персонажа, который ШАГАЕТ МИР, то есть держит `BodyId` через шаг, двигающий
          # тела и перестраивающий индекс запросов. Четыре цели выше сцену не шагают ни разу, а
          # сцена голдена не держит тел вовсе.
          for G in corner snap slope oneway platform; do
            c++ $SAN -Iengine/framework/character -Iengine/framework/tilemap $LIB $TILES $TILES_FS $CHAR \
              "engine/framework/character/framework_character_${G}_test.cpp" $PLAT -o "char_${G}_san"
            "./char_${G}_san" | tee "char${G}san.txt"
            grep -q ": PASS" "char${G}san.txt"
          done

      - name: Achievements — ASan/UBSan (core + store + delivery + bundle/manifest robustness, Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # -Iengine/achievements тут не нужен (TU лежат в этом каталоге, кавычечный include их находит)
          # и вернул бы коллизию registry.hpp/manifest.hpp с -Iengine/plugin в цепочке achp_san.
          # Швы перечисляются поимённо по той же причине, что и в plugin-шаге: CMake тут не участвует.
          SAN="-fsanitize=address,undefined -fno-omit-frame-pointer -g -O1 -std=gnu++20 -Iengine/core -Iengine/platform"
          # ci-lint: mirrors-group seam-fs
          PLAT_FS="engine/platform/platform_fs.cpp engine/platform/platform_fs_posix.cpp engine/platform/platform_path_posix.cpp engine/platform/platform_env_posix.cpp"
          # ci-lint: mirrors-group seam-args
          PLAT_ARGS="engine/platform/platform_args.cpp engine/platform/platform_args_posix.cpp"
          # ci-lint: mirrors-group seam-mod
          PLAT_MOD="engine/platform/platform_module_posix.cpp engine/platform/platform_guard_posix.cpp"
          c++ $SAN engine/achievements/registry.cpp engine/achievements/tracker.cpp engine/achievements/state.cpp \
            engine/achievements/store.cpp engine/achievements/manifest.cpp engine/achievements/bake.cpp \
            engine/achievements/bake_parse.cpp engine/achievements/achievements_test.cpp $PLAT_FS -o ach_san
          ./ach_san | tee achsan.txt
          grep -q "0xe728fef199e87fc9" achsan.txt
          c++ $SAN engine/achievements/registry.cpp engine/achievements/tracker.cpp engine/achievements/state.cpp \
            engine/achievements/store.cpp engine/achievements/manifest.cpp engine/achievements/bake.cpp \
            engine/achievements/bake_parse.cpp engine/achievements/manifest_test.cpp $PLAT_FS -o achm_san
          ./achm_san | tee achmsan.txt
          grep -q "PASS" achmsan.txt
          c++ $SAN engine/achievements/registry.cpp engine/achievements/tracker.cpp engine/achievements/state.cpp \
            engine/achievements/store.cpp engine/achievements/manifest.cpp engine/achievements/delivery.cpp \
            engine/achievements/delivery_test.cpp $PLAT_FS -o achd_san
          ./achd_san | tee achdsan.txt
          grep -q "PASS" achdsan.txt
          ZLIB=$(find build -type f -name 'libzstd.a' | head -1)
          ZINC=$(find build -maxdepth 4 -path '*zstd-src/lib' -type d | head -1)
          SINC=$(dirname "$(find build -type f -name 'stb_image.h' | head -1)")
          c++ $SAN -Iengine/asset -I"$ZINC" -I"$SINC" \
            engine/achievements/registry.cpp engine/achievements/tracker.cpp engine/achievements/state.cpp \
            engine/achievements/store.cpp engine/achievements/manifest.cpp engine/achievements/bake.cpp \
            engine/achievements/bake_parse.cpp engine/achievements/bundle_source.cpp \
            engine/achievements/bundle_test.cpp engine/asset/bundle_writer.cpp engine/asset/codec.cpp \
            engine/platform/platform_io_posix.cpp engine/platform/platform_process_posix.cpp \
            engine/asset/bundle_view.cpp engine/asset/asset_manager.cpp $PLAT_FS $PLAT_ARGS \
            "$ZLIB" -lpthread -o achb_san
          ./achb_san | tee achbsan.txt
          grep -q "PASS" achbsan.txt
          ./achb_san example_ugly_game/assets/game.bundle | tee achbsan2.txt
          grep -q "PASS" achbsan2.txt
          # Единственный путь, где Delivery держит ссылку в dlopen-нутый код: UAF после dlclose
          # ловится только тут, поэтому -DPLUGIN_FORCE_DLCLOSE — без него host.cpp под ASan
          # библиотеку не размапливает и сценарий не воспроизводится вовсе.
          # Шов окружения — в саму .so, как это делает CMake: полагаться на экспорт символов из
          # хоста нельзя, тот собран без -rdynamic.
          c++ $SAN -Iengine/plugin -shared -fPIC engine/plugin/plugins/ach_fake.cpp \
            engine/platform/platform_env_posix.cpp -o plugin_ach_fake_san.so
          c++ $SAN -Iengine/plugin -shared -fPIC engine/plugin/plugins/ach_v1.cpp -o plugin_ach_v1_san.so
          c++ $SAN -DPLUGIN_FORCE_DLCLOSE -Iengine/plugin engine/achievements/registry.cpp \
            engine/achievements/tracker.cpp engine/achievements/state.cpp engine/achievements/store.cpp \
            engine/achievements/manifest.cpp engine/achievements/delivery.cpp \
            engine/achievements/plugin_backend.cpp engine/plugin/registry.cpp engine/plugin/host.cpp \
            engine/plugin/builtin.cpp engine/plugin/manifest.cpp example_ugly_game/backend_host.cpp \
            engine/achievements/plugin_test.cpp engine/achievements/plugin_test_common.cpp \
            engine/achievements/plugin_host_test.cpp $PLAT_FS $PLAT_ARGS $PLAT_MOD \
            -ldl -o achp_san
          # detect_leaks=0 — вынужденно: после FORCE_DLCLOSE статика выгруженного плагина видна LSan
          # как утечка без символов. UAF (то, ради чего гейт) ловит ASan, а не LSan — не «чинить»
          # включением обратно.
          for KNOBS in "" "ACH_FAKE_OFFLINE=2" "ACH_FAKE_RETRY=2" "ACH_FAKE_FATAL=1" \
                       "ACH_FAKE_REMOTE=BOSS_DOWN" "ACH_FAKE_REMOTE_LATE=BOSS_DOWN"; do
            env $KNOBS ASAN_OPTIONS=detect_leaks=0 ./achp_san ./plugin_ach_fake_san.so \
              ./plugin_ach_v1_san.so | tee achpsan.txt
            grep -q "PASS" achpsan.txt
          done
